  const results = h('div', {class:'gs-results'});
  results.appendChild(h('div', {class:'gs-results-head'}, 'Hasil Pertandingan'));
  function groupIdOfTeam(teamId){ const tm=t.teams.find(function(x){return x.id===teamId;}); return tm ? tm.groupId : undefined; }
  const groupMatches = t.schedule.filter(function(s){
    return s.status==='finished' && groupIdOfTeam(s.teamAId)===activeGroup.id && groupIdOfTeam(s.teamBId)===activeGroup.id;
  }).sort(function(a,b){ return fixtureSortKey(a) - fixtureSortKey(b); });
  if (groupMatches.length===0){
    results.appendChild(h('div', {class:'gs-match-empty'}, 'Belum ada hasil pertandingan di grup ini.'));
  } else {
    const perMatchday = Math.max(1, Math.floor(sorted.length/2));
    groupMatches.forEach(function(s, i){
      if (i % perMatchday === 0){
        results.appendChild(h('div', {class:'gs-matchday-label'}, 'Matchday ' + (Math.floor(i/perMatchday)+1)));
      }
      const teamA = t.teams.find(function(x){return x.id===s.teamAId;});

        h('div', {class:'gs-match-team right'}, [teamLogoEl(teamB||{emoji:'⚽',color:'grad-blue'},22), h('span',{class:'gs-match-team-name'}, teamB?teamB.name:'Tim Dihapus')]),
      ]));

      function formatScorerLines(scorers){
        const order = [], byName = {};
        (scorers||[]).forEach(function(sc){
          if (!byName[sc.name]){ byName[sc.name]=[]; order.push(sc.name); }

          return name + ' ' + minutes;
        });

    tr.appendChild(h('td', {style:{textAlign:'center'}}, editableNumber(function(){return tm.stats.gd;}, function(v){tm.stats.gd=v;}, tm.stats.gd>=0?'text-green':'text-red', {min:-99})));
    tr.appendChild(h('td', {style:{textAlign:'center'}}, editableNumber(function(){return tm.stats.pts;}, function(v){tm.stats.pts=v;}, 'font-bold')));
    tr.appendChild(h('td', {style:{textAlign:'center'}}, [h('span',{class:'card-y', style:{marginRight:'4px'}}), editableNumber(function(){return tm.fairplay.yellow||0;}, function(v){tm.fairplay.yellow=v;}, '')]));
    tr.appendChild(h('td', {style:{textAlign:'center'}}, [h('span',{class:'card-r', style:{marginRight:'4px'}}), editableNumber(function(){return tm.fairplay.red||0;}, function(v){tm.fairplay.red=v;}, '')]));
    tbody.appendChild(tr);
  });
  if (sorted.length===0){ tbody.appendChild(h('tr', {}, h('td', {colspan: showGroupCol?13:12, style:{textAlign:'center', color:'#64748b', padding:'20px 0'}}, 'Belum ada tim di grup ini.'))); }
  table.appendChild(tbody);
  tableInner.appendChild(table);
  tableWrapOuter.appendChild(tableInner);

  // ---- Kartu status kualifikasi tiap tim di grup ini — diletakkan di bawah tabel klasemen (kolom kanan), 2x2 ----
  if (sorted.length > 0){
    const nextRoundName = (t.bracket && t.bracket.rounds && t.bracket.rounds[0]) ? t.bracket.rounds[0].name : 'babak berikutnya';
    const qualifyCount = t.onlyGroupWinners ? 1 : 2;
    const statusGrid = h('div', {class:'gs-status-grid'});
    sorted.forEach(function(tm, idx){
      let cls, iconName, label, note;
      if (idx===0){ cls='gold'; iconName='trophy'; label='Juara Grup'; note='Lolos ke '+nextRoundName; }
      else if (idx===1 && qualifyCount>=2){ cls='silver'; iconName='star'; label='Runner-up'; note='Lolos ke '+nextRoundName; }
      else if (idx===1){ cls='silver'; iconName='star'; label='Peringkat 2'; note='Tersingkir dari turnamen'; }
      else if (idx===sorted.length-1){ cls='out'; iconName='x'; label='Juru Kunci'; note='Tersingkir dari turnamen'; }
      else { cls='bronze'; iconName='shield'; label='Peringkat '+(idx+1); note='Tersingkir dari turnamen'; }
      statusGrid.appendChild(h('div', {class:'gs-status-card '+cls}, [
        icon(iconName, 22, 'gs-status-icon'),
        h('p', {class:'gs-status-team'}, tm.name),
        h('p', {class:'gs-status-label'}, label),
        h('p', {class:'gs-status-note'}, note),
      ]));
    });
    tableWrapOuter.appendChild(statusGrid);
  }

  cols.appendChild(tableWrapOuter);
  panel.appendChild(cols);

  return panel;
}

/* ---------- BRACKET ---------- */
function bracketMatchEl(t, ri, mi, match){
  const isFinalRound = ri === t.bracket.rounds.length - 1;
  function crestFor(name){
    const team = t.teams.find(function(tm){ return tm.name===name; });
    if (team && team.logoUrl) return h('img', {class:'bracket-team-crest', src:team.logoUrl});
    return h('div', {class:'bracket-team-crest-fallback', style:{background: team ? (GRAD_CSS[team.color]||GRAD_CSS['grad-blue']) : '#94a3b8'}}, (team&&team.emoji)||'⚽');
  }
  const row1 = h('div', {class:'bracket-team-row' + (match.winner==='a' ? ' bracket-winner-row' : '')}, [
    match.a!=='TBD' ? crestFor(match.a) : null,
    h('span', {class:'flex items-center gap-1', style:{minWidth:0, flex:'1'}}, [match.winner==='a' ? icon('trophy',11) : null, editableText(function(){return match.a;}, function(v){match.a=v;}, 'bracket-team-name')]),
    match.winner ? h('span', {class:'font-bold'}, String(match.scoreA)) : null
  ]);
  const row2 = h('div', {class:'bracket-team-row' + (match.winner==='b' ? ' bracket-winner-row' : '')}, [
    match.b!=='TBD' ? crestFor(match.b) : null,
    h('span', {class:'flex items-center gap-1', style:{minWidth:0, flex:'1'}}, [match.winner==='b' ? icon('trophy',11) : null, editableText(function(){return match.b;}, function(v){match.b=v;}, 'bracket-team-name')]),
    match.winner ? h('span', {class:'font-bold'}, String(match.scoreB)) : null
  ]);
  const el = h('div', {class:'bracket-match'}, [row1, row2]);
  if (match.note) el.appendChild(h('p', {class:'bracket-note'}, match.note));
  if (state.adminMode && match.a!=='TBD' && match.b!=='TBD'){
    el.appendChild(h('button', {class:'btn btn-ghost-purple', style:{fontSize:'10px', padding:'4px 8px', marginTop:'2px', width:'fit-content'}, onclick:function(){
      state.showBracketWinner = {ri:ri, mi:mi}; render();
    }}, [icon('trophy',10), match.winner ? 'Ubah Pemenang' : (isFinalRound ? 'Tentukan Juara' : 'Tentukan Pemenang')]));
  }
  return el;
}
function connLineH(x, y, width){
  return h('div', {class:'bracket-line-h', style:{left:x+'px', top:y+'px', width:Math.max(width,0)+'px'}});
}
function connLineV(x, yTop, height){
  return h('div', {class:'bracket-line-v', style:{left:x+'px', top:yTop+'px', height:Math.max(height,0)+'px'}});
}

function bpVTeamBox(t, match, isA, mirrored){
  const name = isA ? match.a : match.b;
  const isWinner = match.winner === (isA ? 'a' : 'b');
  const team = t.teams.find(function(tm){ return tm.name===name; });
  const crest = team ? (team.logoUrl ? h('img',{class:'bracket-team-crest', src:team.logoUrl}) : h('div', {class:'bracket-team-crest-fallback', style:{background:GRAD_CSS[team.color]||GRAD_CSS['grad-blue']}}, team.emoji||'⚽')) : null;
  // Skor cuma ditampilkan kalau pertandingan ini sudah punya hasil (pemenang ditentukan) —
  // sebelum itu (mis. masih fase penyisihan grup, semifinal belum dijadwalkan/dimainkan),
  // jangan tampilkan "0" yang bisa disalahartikan seolah sudah ada hasil.
  const scoreEl = match.winner ? h('span', {class:'font-bold'}, String(isA?match.scoreA:match.scoreB)) : null;
  const trophyEl = isWinner ? icon('trophy',11) : null;
  const nameEl = h('span', {class:'bp-v-name'}, name);
  // Sisi kiri bagan: logo dulu baru nama (rata kiri). Sisi kanan bagan: dicerminkan —
  // nama duluan (teksnya rata kanan, nempel ke logo), logo di ujung kanan.
  const children = mirrored ? [scoreEl, trophyEl, nameEl, crest] : [crest, trophyEl, nameEl, scoreEl];
  return h('div', {class:'bp-v-team-box' + (isWinner?' winner':'') + (team?'':' placeholder') + (mirrored?' mirrored':'')}, children);
}

// Layout khusus 2 semifinal -> final, bentuk "V" ketemu di tengah — niru poster bagan referensi.
function buildBracketPosterVShape(t, panel, rounds){
  const sfMatches = rounds[0].matches;
  const finalMatch = rounds[1].matches[0];
  const BOX_H = 46, GAP_BETWEEN = 64, GAP_W = 34, SIDE_W = 200, CENTER_W = 150;
  const totalH = BOX_H*2 + GAP_BETWEEN;
  const y1 = BOX_H/2, y2 = BOX_H + GAP_BETWEEN + BOX_H/2, yMid = totalH/2;
  function isRealTeam(name){ return t.teams.some(function(tm){return tm.name===name;}); }

  function statusLabel(m){
    if (!isRealTeam(m.a) || !isRealTeam(m.b)) return 'Menunggu Hasil Grup';
    if (m.winner) return (m.winner==='a'?m.a:m.b) + ' Menang';
    return 'Menunggu Hasil';
  }

  function sideEl(match, mirrored){
    const side = h('div', {class:'bp-v-side', style:{width:SIDE_W+'px', height:totalH+'px'}});
    const boxA = bpVTeamBox(t, match, true); Object.assign(boxA.style, {position:'absolute', top:(y1-BOX_H/2)+'px', left:'0', width:SIDE_W+'px'});
    const boxB = bpVTeamBox(t, match, false); Object.assign(boxB.style, {position:'absolute', top:(y2-BOX_H/2)+'px', left:'0', width:SIDE_W+'px'});
    side.appendChild(boxA); side.appendChild(boxB);
    // garis penghubung: dua horizontal dari tiap box -> ketemu vertikal -> satu horizontal ke tengah
    const edgeX = mirrored ? SIDE_W : 0; // sisi kanan bagan: box ada di kanan wrap, garis keluar ke kiri (x=0); sisi kiri: garis keluar ke kanan (x=SIDE_W)
    const xMid = mirrored ? SIDE_W - GAP_W/2 : SIDE_W + GAP_W/2;
    if (!mirrored){
      side.appendChild(connLineH(edgeX, y1, GAP_W/2));
      side.appendChild(connLineH(edgeX, y2, GAP_W/2));
      side.appendChild(connLineV(xMid, Math.min(y1,y2), Math.abs(y2-y1)));
      side.appendChild(connLineH(xMid, yMid, GAP_W/2));
    }
    side.appendChild(h('div', {class:'bp-v-mid-label', style:{top:yMid+'px'}}, statusLabel(match)));
    if (state.adminMode && isRealTeam(match.a) && isRealTeam(match.b)){
      side.appendChild(h('div', {class:'bp-v-btn-wrap', style:{top:(yMid+16)+'px'}}, [
        h('button', {class:'btn btn-ghost-purple', style:{fontSize:'9.5px', padding:'3px 8px'}, onclick:function(){
          const ri = 0, mi = sfMatches.indexOf(match);
          state.showBracketWinner = {ri:ri, mi:mi}; render();
        }}, match.winner ? 'Ubah Pemenang' : 'Tentukan Pemenang')
      ]));
    }
    return side;
  }

  const leftSide = sideEl(sfMatches[0], false);
  const rightSideInner = h('div', {class:'bp-v-side', style:{width:SIDE_W+'px', height:totalH+'px'}});
  // sisi kanan: box digeser ke kanan (setelah garis), garis keluar dari kiri box menuju tengah
  const rBoxA = bpVTeamBox(t, sfMatches[1], true, true); Object.assign(rBoxA.style, {position:'absolute', top:(y1-BOX_H/2)+'px', left:GAP_W+'px', width:SIDE_W+'px'});
  const rBoxB = bpVTeamBox(t, sfMatches[1], false, true); Object.assign(rBoxB.style, {position:'absolute', top:(y2-BOX_H/2)+'px', left:GAP_W+'px', width:SIDE_W+'px'});
  rightSideInner.appendChild(rBoxA); rightSideInner.appendChild(rBoxB);
  rightSideInner.style.width = (SIDE_W+GAP_W)+'px';
  const xMidR = GAP_W/2;
  rightSideInner.appendChild(connLineH(0, yMid, GAP_W/2));
  rightSideInner.appendChild(connLineV(xMidR, Math.min(y1,y2), Math.abs(y2-y1)));
  rightSideInner.appendChild(connLineH(xMidR, y1, GAP_W/2));
  rightSideInner.appendChild(connLineH(xMidR, y2, GAP_W/2));
  rightSideInner.appendChild(h('div', {class:'bp-v-mid-label', style:{top:yMid+'px', left:(GAP_W+8)+'px', transform:'translate(0,-50%)'}}, statusLabel(sfMatches[1])));
  if (state.adminMode && isRealTeam(sfMatches[1].a) && isRealTeam(sfMatches[1].b)){
    rightSideInner.appendChild(h('div', {class:'bp-v-btn-wrap', style:{top:(yMid+16)+'px', left:(GAP_W+8+70)+'px'}}, [
      h('button', {class:'btn btn-ghost-purple', style:{fontSize:'9.5px', padding:'3px 8px'}, onclick:function(){
        state.showBracketWinner = {ri:0, mi:1}; render();
      }}, sfMatches[1].winner ? 'Ubah Pemenang' : 'Tentukan Pemenang')
    ]));
  }

  const finalDone = isRealTeam(finalMatch.a) && isRealTeam(finalMatch.b);
  const championName = finalMatch.winner ? (finalMatch.winner==='a'?finalMatch.a:finalMatch.b) : null;
  const centerCol = h('div', {class:'bp-v-center', style:{height:totalH+'px'}});
  const centerStack = h('div', {class:'bp-v-center-stack', style:{top:(yMid-15)+'px'}}, [
    icon('trophy', 30, 'gs-hero-trophy'),
    h('div', {class:'bp-v-center-label'}, rounds[1].name.toUpperCase()),
    h('div', {class:'bp-v-center-sub'}, finalDone ? (finalMatch.a+' vs '+finalMatch.b) : 'Menunggu Semifinalis'),
    finalDone ? h('div', {class:'bp-v-center-score'}, finalMatch.scoreA+' - '+finalMatch.scoreB) : null,
    championName ? h('div', {class:'bp-v-center-sub', style:{color:'var(--acc-amber-text)', fontWeight:'700', marginTop:'2px'}}, '🏆 '+championName) : null,
    (state.adminMode && finalDone) ? h('button', {class:'btn btn-ghost-purple', style:{fontSize:'9.5px', padding:'3px 8px', marginTop:'4px'}, onclick:function(){
      state.showBracketWinner = {ri:1, mi:0}; render();
    }}, finalMatch.winner ? 'Ubah Juara' : 'Tentukan Juara') : null,
  ]);
  centerCol.appendChild(centerStack);

  const wrap = h('div', {class:'bp-v-wrap'}, [leftSide, centerCol, rightSideInner]);
  panel.appendChild(h('div', {class:'bracket-tree-scroll scrollbar'}, [wrap]));
}

function buildBracketPanel(t){
  syncBracketFromGroupWinners(t); // selalu segarkan slot semifinal dari juara grup terkini tiap halaman ini dibuka
  const outerPanel = h('div', {class:'panel bracket-poster'});
  const panel = h('div', {class:'bracket-poster-inner'});
  outerPanel.appendChild(panel);
  panel.appendChild(h('div', {class:'bp-glow-a'}));
  panel.appendChild(h('div', {class:'bp-glow-b'}));
  panel.appendChild(h('div', {class:'bp-corner tl'}));
  panel.appendChild(h('div', {class:'bp-corner br'}));

  const syncBtn = (state.adminMode && t.groups && t.groups.length>0 && t.bracket) ? h('button', {class:'btn btn-ghost-purple', style:{position:'relative'}, onclick:function(){ syncBracketFromGroupWinners(t); render(); }}, [icon('trophy',13), 'Perbarui dari Juara Grup']) : null;

  if (!t.bracket){
    panel.appendChild(h('div', {class:'bracket-poster-head'}, [
      h('p', {class:'bracket-poster-eyebrow'}, 'BAGAN TURNAMEN'),
      h('h2', {class:'bracket-poster-title'}, t.name.toUpperCase()),
    ]));
    panel.appendChild(h('p', {class:'text-sm', style:{color:'rgba(255,255,255,.6)', position:'relative', textAlign:'center'}}, 'Turnamen ini menggunakan format grup saja, tidak ada babak knockout.'));
    return outerPanel;
  }
  const rounds = t.bracket.rounds;

  panel.appendChild(h('div', {class:'bracket-poster-head'}, [
    h('p', {class:'bracket-poster-eyebrow'}, 'BAGAN TURNAMEN'),
    h('h2', {class:'bracket-poster-title'}, t.name.toUpperCase()),
    h('div', {class:'bracket-poster-round-badge'}, [icon('trophy',11), rounds[0].name]),
    syncBtn ? h('div', {style:{marginTop:'12px'}}, syncBtn) : null,
  ]));

  if (rounds.length===2 && rounds[0].matches.length===2 && rounds[1].matches.length===1){
    buildBracketPosterVShape(t, panel, rounds);
    return outerPanel;
  }

  const COL_W = 208;      // lebar kartu pertandingan
  const GAP_W = 48;       // jarak horizontal antar ronde (tempat garis penghubung)
  const MATCH_H = 74;     // tinggi kartu pertandingan
  const SLOT = 96;        // jarak vertikal antar pertandingan di ronde pertama

  // Hitung titik tengah vertikal (px) tiap match di tiap ronde, dari bawah ke atas (ronde 1 -> final)
  const n0 = rounds[0].matches.length;
  const centers = [];
  centers[0] = [];
  for (let i=0;i<n0;i++) centers[0][i] = i*SLOT + SLOT/2;
  for (let r=1;r<rounds.length;r++){
    centers[r] = [];
    for (let i=0;i<rounds[r].matches.length;i++){
      centers[r][i] = (centers[r-1][i*2] + centers[r-1][i*2+1]) / 2;
    }
  }
  const totalHeight = n0*SLOT;

  // Header label tiap ronde, sejajar dengan kolomnya
  const header = h('div', {class:'bracket-tree-header'});
  rounds.forEach(function(round, ri){
    header.appendChild(h('div', {class:'col-label', style:{width:COL_W+'px', marginRight:GAP_W+'px'}}, [
      ri===rounds.length-1 ? icon('trophy',12) : null, round.name
    ]));
  });
  header.appendChild(h('div', {class:'col-label', style:{width:'150px'}}, [icon('trophy',12), 'Juara']));

  const treeWrap = h('div', {class:'bracket-tree', style:{height:totalHeight+'px', width:(rounds.length*(COL_W+GAP_W))+'px'}});

  rounds.forEach(function(round, ri){
    round.matches.forEach(function(m, mi){
      const top = centers[ri][mi] - MATCH_H/2;
      const left = ri*(COL_W+GAP_W);
      const matchEl = bracketMatchEl(t, ri, mi, m);
      Object.assign(matchEl.style, {top:top+'px', left:left+'px', width:COL_W+'px'});
      treeWrap.appendChild(matchEl);
    });
    if (ri < rounds.length-1){
      const nextCenters = centers[ri+1];
      const xRight = ri*(COL_W+GAP_W) + COL_W;
      const xMid = xRight + GAP_W/2;
      for (let i=0;i<nextCenters.length;i++){
        const cA = centers[ri][i*2], cB = centers[ri][i*2+1];
        const nc = nextCenters[i];
        treeWrap.appendChild(connLineH(xRight, cA, GAP_W/2));
        treeWrap.appendChild(connLineH(xRight, cB, GAP_W/2));
        treeWrap.appendChild(connLineV(xMid, Math.min(cA,cB), Math.abs(cB-cA)));
        treeWrap.appendChild(connLineH(xMid, nc, GAP_W/2));
      }
    }
  });

  const scrollWrap = h('div', {class:'bracket-tree-scroll scrollbar'});
  const innerRow = h('div', {class:'flex', style:{alignItems:'center'}}, [treeWrap, (function(){
    const finalMatch = rounds[rounds.length-1].matches[0];
    const championName = finalMatch && finalMatch.winner ? (finalMatch.winner==='a' ? finalMatch.a : finalMatch.b) : null;
    return h('div', {class:'bracket-champion-col', style:{width:'150px'}}, [
      h('div', {class:'bracket-champion-card' + (championName ? '' : ' pending')}, [
        icon('trophy', 22),
        h('span', {class:'cc-label'}, 'Juara Turnamen'),
        h('span', {class:'cc-name'}, championName || 'Belum ditentukan')
      ])
    ]);
  })()]);
  scrollWrap.appendChild(header);
  scrollWrap.appendChild(innerRow);
  panel.appendChild(scrollWrap);
  return outerPanel;
}


/* ---------- BRACKET WINNER / PENALTY SHOOTOUT MODAL ---------- */
function buildBracketWinnerModal(t){
  const cfg = state.showBracketWinner; // {ri, mi}
  const round = t.bracket.rounds[cfg.ri];
  const match = round.matches[cfg.mi];
  const isFinalRound = cfg.ri === t.bracket.rounds.length - 1;
  const nextRound = t.bracket.rounds[cfg.ri + 1];

  const form = { scoreA: match.scoreA||0, scoreB: match.scoreB||0, penA: 0, penB: 0 };

  const overlay = h('div', {class:'modal-overlay', onclick:function(e){ if(e.target===overlay){ state.showBracketWinner=null; render(); } }});
  const box = h('div', {class:'modal-box', style:{maxWidth:'400px'}});
  box.appendChild(h('div', {class:'modal-head'}, [h('h3',{},'Tentukan Pemenang'), h('button',{class:'modal-close', onclick:function(){ state.showBracketWinner=null; render(); }}, icon('x',20))]));

  const body = h('div', {class:'flex-col gap-4'});

  // Skor pertandingan diisi di sini (bukan langsung di tampilan bagan) — supaya bagan tidak
  // menampilkan angka "0-0" seolah pertandingan sudah berjalan padahal belum dijadwalkan.
  const scoreRow = h('div', {class:'form-row cols-2'});
  const aScoreInp = h('input', {type:'number', class:'form-input', min:0, value:form.scoreA});
  const bScoreInp = h('input', {type:'number', class:'form-input', min:0, value:form.scoreB});
  scoreRow.appendChild(h('div', {}, [h('label',{class:'form-label'}, 'Skor '+match.a), aScoreInp]));
  scoreRow.appendChild(h('div', {}, [h('label',{class:'form-label'}, 'Skor '+match.b), bScoreInp]));
  body.appendChild(scoreRow);

  const dynamicWrap = h('div', {class:'flex-col gap-4'});
  body.appendChild(dynamicWrap);

  function refreshDynamic(){
    dynamicWrap.innerHTML = '';
    const isDraw = form.scoreA === form.scoreB;
    if (!isDraw){
      const winnerName = form.scoreA > form.scoreB ? match.a : match.b;
      dynamicWrap.appendChild(h('p', {class:'text-xs muted', style:{margin:0}}, 'Pemenangnya adalah ' + winnerName + '.'));
      dynamicWrap.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px'}, onclick:function(){
        applyWinner(form.scoreA > form.scoreB ? 'a' : 'b', null, null);
      }}, [icon('trophy',16), isFinalRound ? 'Jadikan Juara' : 'Simpan & Lanjutkan ke Babak Berikutnya']));
    } else {
      dynamicWrap.appendChild(h('p', {class:'text-xs muted', style:{margin:0}}, 'Skor imbang — masukkan hasil adu penalti untuk menentukan pemenang.'));
      const row = h('div', {class:'form-row cols-2'});
      const aInp = h('input', {type:'number', class:'form-input', min:0, value:0});
      aInp.addEventListener('input', function(e){ form.penA = parseInt(e.target.value,10)||0; });
      const bInp = h('input', {type:'number', class:'form-input', min:0, value:0});
      bInp.addEventListener('input', function(e){ form.penB = parseInt(e.target.value,10)||0; });
      row.appendChild(h('div', {}, [h('label',{class:'form-label'}, 'Penalti ' + match.a), aInp]));
      row.appendChild(h('div', {}, [h('label',{class:'form-label'}, 'Penalti ' + match.b), bInp]));
      dynamicWrap.appendChild(row);
      const statusMsg = h('p', {class:'text-xs muted', style:{margin:0}});
      dynamicWrap.appendChild(statusMsg);
      dynamicWrap.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px'}, onclick:function(){
        if (form.penA === form.penB){ statusMsg.textContent = 'Hasil adu penalti tidak boleh imbang.'; return; }
        applyWinner(form.penA > form.penB ? 'a' : 'b', form.penA, form.penB);
      }}, [icon('trophy',16), isFinalRound ? 'Jadikan Juara' : 'Simpan & Lanjutkan ke Babak Berikutnya']));
    }
  }
  aScoreInp.addEventListener('input', function(e){ form.scoreA = parseInt(e.target.value,10)||0; refreshDynamic(); });
  bScoreInp.addEventListener('input', function(e){ form.scoreB = parseInt(e.target.value,10)||0; refreshDynamic(); });
  refreshDynamic();

  function applyWinner(side, penA, penB){
    match.scoreA = form.scoreA; match.scoreB = form.scoreB;
    match.winner = side;
    if (penA!==null && penB!==null) match.note = 'Menang Adu Penalti ' + penA + '-' + penB;
    const winnerName = side==='a' ? match.a : match.b;
    if (nextRound){
      const nextIdx = Math.floor(cfg.mi/2);
      const slot = cfg.mi % 2 === 0 ? 'a' : 'b';
      nextRound.matches[nextIdx][slot] = winnerName;
    }
    state.showBracketWinner = null;
    render();
  }

  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

/* ---------- LOGIN ADMIN (Firebase Auth) ---------- */
function buildAdminLoginModal(){

  const box = h('div', {class:'modal-box', style:{maxWidth:'380px'}});

// Hitung ulang Best Goalkeepers dari histori pertandingan yang sudah selesai, berdasarkan
// siapa yang SEKARANG ditandai posisi "GK" di tiap tim. Berguna kalau posisi kiper baru
// ditandai belakangan (setelah beberapa pertandingan sudah berjalan) — pertandingan lama
// yang clean sheet-nya belum sempat kehitung otomatis jadi ikut terhitung.
function recalculateBestGK(t){
  const cleanSheetCount = {}; // teamId -> jumlah clean sheet
  t.schedule.forEach(function(s){
    if (s.status !== 'finished') return;
    if (Number(s.scoreB)===0) cleanSheetCount[s.teamAId] = (cleanSheetCount[s.teamAId]||0)+1;
    if (Number(s.scoreA)===0) cleanSheetCount[s.teamBId] = (cleanSheetCount[s.teamBId]||0)+1;
  });
  const newList = [];
  t.teams.forEach(function(team){
    const gk = team.players.find(function(p){return p.position==='GK';});
    if (!gk) return;
    const cs = cleanSheetCount[team.id] || 0;
    if (cs > 0) newList.push({id:nextId(), name:gk.name, team:team.name, cleanSheets:cs});
  });
  t.bestGK = newList;
}

let fixtureForm = { teamAId:null, teamBId:null, date:'', time:'' };

let expandedFixtureDetails = {};
function buildFixturesPage(t){
  const wrap = h('div', {class:'flex-col gap-6'});

  if (!fixtureForm.teamBId && t.teams[1]) fixtureForm.teamBId = t.teams[1].id;

  if (state.adminMode){
    const panel = h('div', {class:'panel'});
    panel.appendChild(sectionTitle('plus', 'Tambah Jadwal Baru'));
    const row = h('div', {class:'form-row cols-5'});
    const selA = h('select', {class:'form-input'}, t.teams.map(function(tm){ return h('option',{value:tm.id}, tm.name); }));
    selA.value = fixtureForm.teamAId; selA.addEventListener('change', function(e){ fixtureForm.teamAId=e.target.value; });
    const selB = h('select', {class:'form-input'}, t.teams.map(function(tm){ return h('option',{value:tm.id}, tm.name); }));
    selB.value = fixtureForm.teamBId; selB.addEventListener('change', function(e){ fixtureForm.teamBId=e.target.value; });
    var dateMonths = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    function dateToDisplay(isoStr){
      if (!isoStr) return '';
      var p = isoStr.split('-'); if(p.length!==3) return isoStr;
      var d = parseInt(p[2],10), m = parseInt(p[1],10)-1, y = p[0];
      return d + ' ' + (dateMonths[m]||'') + ' ' + y;
    }
    function displayToIso(displayStr){
      if (!displayStr) return '';
      var p = displayStr.split(' '); if(p.length!==3) return '';
      var d = parseInt(p[0],10), mIdx = dateMonths.indexOf(p[1]), y = p[2];
      if (mIdx===-1 || isNaN(d)) return '';
      return y + '-' + String(mIdx+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    }
    var dateIsoVal = displayToIso(fixtureForm.date);
    const dateInp = h('input', {type:'date', class:'form-input', value:dateIsoVal});
    dateInp.addEventListener('change', function(e){ fixtureForm.date = dateToDisplay(e.target.value); });
    const timeInp = h('input', {type:'time', class:'form-input', value:fixtureForm.time});
    timeInp.addEventListener('change', function(e){ fixtureForm.time = e.target.value; });
    const addBtn = h('button', {class:'btn btn-primary', onclick:function(){
      if (!fixtureForm.teamAId || !fixtureForm.teamBId || fixtureForm.teamAId===fixtureForm.teamBId || !fixtureForm.date || !fixtureForm.time) return;
      t.schedule.push({id:nextId(), teamAId:fixtureForm.teamAId, teamBId:fixtureForm.teamBId, date:fixtureForm.date, time:fixtureForm.time, status:'upcoming', scoreA:0, scoreB:0, statsApplied:false});
      fixtureForm.date=''; fixtureForm.time='';
      render();
    }}, [icon('plus',14), 'Tambah']);
    row.appendChild(selA); row.appendChild(selB); row.appendChild(dateInp); row.appendChild(timeInp); row.appendChild(addBtn);
    panel.appendChild(row);
    wrap.appendChild(panel);
  }

  const panel2 = h('div', {class:'panel'});
  panel2.appendChild(sectionTitle('calendar', 'Semua Jadwal Pertandingan'));
  const teamName = function(id){ const f=t.teams.find(function(x){return x.id===id;}); return f?f.name:'Tim Dihapus'; };

  t.schedule.forEach(function(s){
    const infoBlock = h('div', {style:{flex:1, minWidth:0}});
    const nameRow = h('div', {class:'flex items-center gap-2 text-sm'});
    nameRow.appendChild(h('span', {class:'font-semibold truncate'}, teamName(s.teamAId)));
    if (s.status==='finished'){
      nameRow.appendChild(h('span', {class:'disp font-bold', style:{color:'#93c5fd'}}, s.scoreA+' - '+s.scoreB));
    } else {
      nameRow.appendChild(h('span', {class:'text-xs muted'}, 'vs'));
    }
    nameRow.appendChild(h('span', {class:'font-semibold truncate'}, teamName(s.teamBId)));
    infoBlock.appendChild(nameRow);
    infoBlock.appendChild(h('div', {class:'text-xs muted', style:{marginTop:'4px'}}, s.date+' • '+s.time));

    const badge = h('span', {class:'status-pill ' + (s.status==='live'?'status-live':(s.status==='finished'?'status-finished':'status-upcoming'))}, s.status==='live'?'LIVE':(s.status==='finished'?'Selesai':'Mendatang'));

    const actions = h('div', {class:'fixture-actions'});
    if (state.adminMode){
      if (s.status==='finished'){
        actions.appendChild(h('div', {class:'flex items-center gap-1 text-xs'}, [
          editableNumber(function(){return s.scoreA;}, function(v){ setFixtureScore(t, s, 'a', v); }, ''), h('span',{class:'muted'},'-'), editableNumber(function(){return s.scoreB;}, function(v){ setFixtureScore(t, s, 'b', v); }, '')
        ]));
      }
      if (s.status!=='live'){
        actions.appendChild(h('button', {class:'btn btn-ghost-red', onclick:function(){
          const teamA = t.teams.find(function(x){return x.id===s.teamAId;});
          const teamB = t.teams.find(function(x){return x.id===s.teamBId;});
          t.liveMatch = { teamA:{id:teamA?teamA.id:null, name:(teamA&&teamA.name)||'Tim A', score:0, yellow:0, red:0, scorers:[], cards:[]}, teamB:{id:teamB?teamB.id:null, name:(teamB&&teamB.name)||'Tim B', score:0, yellow:0, red:0, scorers:[], cards:[]}, minute:0, second:0 };
          s.status='live'; state.active='dashboard'; render();
        }}, [icon('radio',11), 'Live']));
      }
      if (s.status!=='finished'){
        actions.appendChild(h('button', {class:'btn btn-ghost-green', onclick:function(){ finalizeFixture(t, s); render(); }}, [icon('check',11), 'Selesai']));
      }
      actions.appendChild(h('button', {class:'icon-btn', onclick:function(){ t.schedule = t.schedule.filter(function(x){return x.id!==s.id;}); render(); }}, icon('trash',15)));
    }

    panel2.appendChild(h('div', {class:'fixture-item'}, [infoBlock, badge, actions]));

    // Detail gol & kartu untuk pertandingan yang sudah selesai — bisa direvisi kapan saja.
    // Untuk admin, tombolnya selalu muncul (bukan hanya kalau sudah ada catatan) supaya
    // pertandingan yang skornya dulu diisi manual pun tetap bisa ditambahkan detailnya.
    const hasExistingDetail = (s.scorersA&&s.scorersA.length) || (s.scorersB&&s.scorersB.length) || (s.cardsA&&s.cardsA.length) || (s.cardsB&&s.cardsB.length);
    const hasDetail = s.status==='finished' && (hasExistingDetail || state.adminMode);
    if (hasDetail){
      const detailWrap = h('div', {style:{padding:'0 4px 10px', marginTop:'-6px'}});
      const toggleBtn = h('button', {class:'btn btn-ghost-blue', style:{fontSize:'11px', padding:'5px 10px'}, onclick:function(){
        expandedFixtureDetails[s.id] = !expandedFixtureDetails[s.id]; render();
      }}, [expandedFixtureDetails[s.id] ? '▲ Sembunyikan Detail Gol & Kartu' : '▼ Lihat/Edit Detail Gol & Kartu']);
      detailWrap.appendChild(toggleBtn);
      if (expandedFixtureDetails[s.id]){
        const grid = h('div', {style:{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginTop:'8px'}});
        [{side:'A', label:teamName(s.teamAId), scorersKey:'scorersA', cardsKey:'cardsA'}, {side:'B', label:teamName(s.teamBId), scorersKey:'scorersB', cardsKey:'cardsB'}].forEach(function(sideCfg){
          if (!s[sideCfg.scorersKey]) s[sideCfg.scorersKey] = [];
          if (!s[sideCfg.cardsKey]) s[sideCfg.cardsKey] = [];
          const col = h('div', {class:'fb-config-box', style:{fontFamily:'inherit'}});
          const colHead = h('div', {class:'flex items-center justify-between', style:{marginBottom:'6px'}}, [h('p', {class:'text-xs font-semibold', style:{margin:0}}, sideCfg.label)]);
          if (state.adminMode){
            const btnRow = h('div', {class:'flex gap-1'});
            btnRow.appendChild(h('button', {class:'icon-btn', title:'Tambah gol', onclick:function(){ state.showAddFixtureEvent = {fixtureId:s.id, side:sideCfg.side, type:'goal'}; render(); }}, icon('plus',12)));
            btnRow.appendChild(h('button', {class:'icon-btn', title:'Tambah kartu', onclick:function(){ state.showAddFixtureEvent = {fixtureId:s.id, side:sideCfg.side, type:'card'}; render(); }}, cardsIcon(13)));
            colHead.appendChild(btnRow);
          }
          col.appendChild(colHead);
          col.appendChild(buildEventList(s[sideCfg.scorersKey], 'goal', function(i){ s[sideCfg.scorersKey].splice(i,1); render(); }));
          col.appendChild(buildEventList(s[sideCfg.cardsKey], 'card', function(i){ s[sideCfg.cardsKey].splice(i,1); render(); }));
          if (s[sideCfg.scorersKey].length===0 && s[sideCfg.cardsKey].length===0) col.appendChild(h('p',{class:'text-xs muted'},'Tidak ada catatan.'));
          grid.appendChild(col);
        });
        detailWrap.appendChild(grid);
      }
      panel2.appendChild(detailWrap);
    }
  });
  if (t.schedule.length===0) panel2.appendChild(h('p',{class:'text-sm muted'},'Belum ada jadwal pertandingan.'));
  wrap.appendChild(panel2);

  return wrap;
}

/* ---------- IMPORT TEAMS FROM EXCEL MODAL ---------- */
function buildImportTeamsModal(t){
  const imp = { rows: [], logoMap: {} }; // rows: {name, group, emoji, color, logoUrl, include}

  function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[\s_-]+/g,''); }

  function pickField(rowObj, aliases){
    const keys = Object.keys(rowObj);
    for (let i=0;i<keys.length;i++){
      const nk = keys[i].trim().toLowerCase();
      if (aliases.indexOf(nk) !== -1) return rowObj[keys[i]];
    }
    return '';
  }

  function applyLogoMatches(){
    imp.rows.forEach(function(r){
      if (!r.logoUrl && imp.logoMap[normKey(r.name)]) r.logoUrl = imp.logoMap[normKey(r.name)];
    });
  }

  const overlay = h('div', {class:'modal-overlay', onclick:function(e){ if(e.target===overlay){ state.showImportTeams=false; render(); } }});
  const box = h('div', {class:'modal-box', style:{maxWidth:'560px'}});
  box.appendChild(h('div', {class:'modal-head'}, [h('h3',{},'Import Tim dari Excel'), h('button',{class:'modal-close', onclick:function(){ state.showImportTeams=false; render(); }}, icon('x',20))]));

  const body = h('div', {class:'flex-col gap-4'});

  body.appendChild(h('p', {class:'text-xs muted', style:{margin:0}}, 'Satu file untuk semua tim & pemain sekaligus — 1 baris = 1 pemain. Kolom: "Nama Tim", "Grup", "Emoji" (opsional), "Warna" (opsional), "Logo URL" (opsional), "Nama Pemain", "No Punggung", "Posisi" (opsional). Cukup TULIS ULANG nama tim yang sama di setiap baris pemainnya — sistem otomatis mengelompokkan baris dengan "Nama Tim" yang sama jadi satu tim. Grup yang belum ada akan otomatis dibuat.'));

  body.appendChild(h('button', {class:'btn btn-ghost-purple', style:{width:'fit-content'}, onclick:function(){
    const wsData = [
      ['Nama Tim','Grup','Emoji','Warna','Logo URL','Nama Pemain','No Punggung','Posisi'],
      ['Delta Force','Grup A','⚡','grad-blue','','R. Aditya',9,'FW'],
      ['Delta Force','Grup A','⚡','grad-blue','','M. Fadli',7,'FW'],
      ['Delta Force','Grup A','⚡','grad-blue','','S. Kurniawan',1,'GK'],
      ['United Lions','Grup B','🦁','grad-purple','','J. Santoso',10,'FW'],
      ['United Lions','Grup B','🦁','grad-purple','','B. Setiawan',1,'GK'],
      ['Garuda FC','Grup A','🦅','grad-teal','','D. Pratama',11,'FW'],
      ['Garuda FC','Grup A','🦅','grad-teal','','F. Nugroho',1,'GK'],
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tim');
    XLSX.writeFile(wb, 'template-import-tim.xlsx');
  }}, [icon('download',13), 'Unduh Template Excel']));

  const step1 = h('div', {});
  step1.appendChild(h('label',{class:'form-label'}, '1. Pilih File Excel / CSV (.xlsx, .xls, .csv)'));
  const fileInput = h('input', {type:'file', accept:'.xlsx,.xls,.csv', class:'form-input'});
  step1.appendChild(fileInput);
  body.appendChild(step1);

  const step2 = h('div', {});
  step2.appendChild(h('label',{class:'form-label'}, '2. (Opsional) Pilih Logo Tim — bisa pilih banyak file sekaligus'));
  step2.appendChild(h('p', {class:'text-xs muted', style:{margin:'0 0 6px'}}, 'Logo otomatis dicocokkan ke tim berdasarkan nama file, mis. "Delta Force.png" akan jadi logo tim "Delta Force".'));
  const logoInput = h('input', {type:'file', accept:'image/*', multiple:true, class:'form-input'});
  step2.appendChild(logoInput);
  body.appendChild(step2);

  const previewWrap = h('div', {class:'flex-col gap-2', style:{maxHeight:'260px', overflowY:'auto'}});
  body.appendChild(previewWrap);

  const statusMsg = h('p', {class:'text-xs muted', style:{margin:0}});
  body.appendChild(statusMsg);

  function renderPreview(){
    previewWrap.innerHTML = '';
    if (imp.rows.length === 0) return;
    imp.rows.forEach(function(r, idx){
      const row = h('div', {class:'import-row'});
      const chk = h('input', {type:'checkbox', checked: r.include}, []);
      chk.checked = r.include;
      chk.addEventListener('change', function(e){ r.include = e.target.checked; });
      row.appendChild(chk);
      row.appendChild(r.logoUrl ? h('img',{src:r.logoUrl, class:'import-thumb', style:{objectFit:'cover'}}) : h('div',{class:'import-thumb', style:{background:GRAD_CSS[r.color]||GRAD_CSS['grad-blue'], display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px'}}, r.emoji||'⚽'));
      const info = h('div', {class:'flex-col', style:{flex:'1', minWidth:'0'}});
      info.appendChild(h('span', {class:'text-sm font-semibold truncate'}, r.name || '(tanpa nama)'));
      const playerCount = (r.players||[]).length;
      info.appendChild(h('span', {class:'text-xs muted truncate'}, (r.group ? r.group : 'Tanpa grup') + ' · ' + playerCount + ' pemain'));
      if (playerCount > 0){
        const plist = h('div', {class:'flex-wrap', style:{gap:'4px', marginTop:'4px'}});
        r.players.forEach(function(p){
          plist.appendChild(h('span', {class:'text-xs mono', style:{background:'rgba(255,255,255,.06)', border:'1px solid var(--border)', borderRadius:'999px', padding:'2px 8px'}}, '#'+p.number+' '+p.name));
        });
        info.appendChild(plist);
      }
      row.appendChild(info);
      previewWrap.appendChild(row);
    });
    const totalPlayers = imp.rows.reduce(function(sum,r){ return sum + (r.players||[]).length; }, 0);
    statusMsg.textContent = imp.rows.length + ' tim dan ' + totalPlayers + ' pemain terbaca dari file. Centang untuk memilih yang mau diimpor.';
  }

  fileInput.addEventListener('change', function(e){
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {defval:''});
        imp.rows = [];
        const byName = {};
        let lastTeam = null;
        json.forEach(function(rowObj, i){
          let name = String(pickField(rowObj, ['nama tim','nama','name','team','tim'])||'').trim();
          const group = String(pickField(rowObj, ['grup','group'])||'').trim();
          let emoji = String(pickField(rowObj, ['emoji'])||'').trim();
          let color = String(pickField(rowObj, ['warna','color'])||'').trim();
          const logoUrl = String(pickField(rowObj, ['logo url','logourl','logo','link logo'])||'').trim();
          const pName = String(pickField(rowObj, ['nama pemain','pemain','player name','player'])||'').trim();
          const pNumberRaw = pickField(rowObj, ['no punggung','nomor punggung','no.punggung','nomor','number','no']);
          const pNumber = parseInt(pNumberRaw, 10);
          let pPosition = String(pickField(rowObj, ['posisi','position','pos'])||'').trim().toUpperCase();
          if (POSITIONS.indexOf(pPosition) === -1) pPosition = 'MF';

          let team;
          if (name){
            const key = name.toLowerCase();
            if (byName[key]){
              team = byName[key];
            } else {
              if (!emoji) emoji = TEAM_EMOJIS[imp.rows.length % TEAM_EMOJIS.length];
              if (!color || !GRAD_CSS[color]) color = TEAM_COLORS[imp.rows.length % TEAM_COLORS.length];
              team = { name:name, group:group, emoji:emoji, color:color, logoUrl: logoUrl || null, include:true, players:[] };
              byName[key] = team;
              imp.rows.push(team);
            }
            lastTeam = team;
          } else {
            team = lastTeam;
          }

          if (team && pName){
            team.players.push({ name:pName, number: isNaN(pNumber) ? (team.players.length+1) : pNumber, position:pPosition });
          }
        });
        applyLogoMatches();
        renderPreview();
      } catch(err){
        statusMsg.textContent = 'Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.';
      }
    };
    reader.readAsArrayBuffer(file);
  });

  logoInput.addEventListener('change', function(e){
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    let remaining = files.length;
    statusMsg.textContent = 'Memproses ' + files.length + ' logo…';
    files.forEach(function(file){
      compressImageFile(file, function(dataUrl){
        if (dataUrl) imp.logoMap[normKey(file.name)] = dataUrl;
        remaining--;
        if (remaining === 0){ applyLogoMatches(); renderPreview(); }
      });
    });
  });

  body.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px', marginTop:'4px'}, onclick:function(){
    const chosen = imp.rows.filter(function(r){ return r.include; });
    if (chosen.length === 0){ statusMsg.textContent = 'Belum ada tim yang dipilih untuk diimpor.'; return; }
    chosen.forEach(function(r){
      let groupId = (t.groups[0] && t.groups[0].id) || null;
      if (r.group){
        let g = t.groups.find(function(x){ return x.name.toLowerCase() === r.group.toLowerCase(); });
        if (!g){ g = { id: nextId(), name: r.group }; t.groups.push(g); }
        groupId = g.id;
      }
      const players = (r.players||[]).map(function(p){ return { id:nextId(), name:p.name, number:p.number, position:p.position }; });
      t.teams.push({
        id: nextId(), name: r.name, emoji: r.emoji, color: r.color, logoUrl: r.logoUrl || null,
        groupId: groupId, stats:{played:0,win:0,draw:0,lose:0,gf:0,ga:0,gd:0,pts:0}, fairplay:{yellow:0,red:0}, players:players
      });
    });
    state.showImportTeams = false;
    render();
  }}, [icon('upload',16), 'Import Tim Terpilih']));

  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

  halfMinInp.addEventListener('input', function(e){ form.halfMinutes = Math.max(1, Math.min(60, parseInt(e.target.value,10)||1)); });
  durRow.appendChild(h('div', {}, [h('label',{class:'form-label'},'Menit per Babak'), halfMinInp]));
  const halvesSelNew = h('select', {class:'form-input'}, [
    h('option',{value:'1'},'1 Babak'),
    h('option',{value:'2'},'2 Babak'),
  ]);
  halvesSelNew.value = String(form.halves);
  halvesSelNew.addEventListener('change', function(e){ form.halves = parseInt(e.target.value,10); });
  durRow.appendChild(h('div', {}, [h('label',{class:'form-label'},'Jumlah Babak'), halvesSelNew]));
  body.appendChild(durRow);
  body.appendChild(h('p', {class:'text-xs muted', style:{marginTop:'-8px'}}, 'Cocok untuk mini turnamen: coba 5 menit x 1 babak biar cepat.'));

  body.appendChild(h('div', {}, [h('label',{class:'form-label'},'Logo / Emoji Turnamen'), (function(){
    const g = h('div', {class:'emoji-grid'});
    TEAM_EMOJIS.forEach(function(e){
      const btn = h('button', {class:'emoji-btn' + (form.emoji===e?' selected':''), onclick:function(){ form.emoji=e; Array.from(g.children).forEach(function(c){c.classList.remove('selected');}); btn.classList.add('selected'); }}, e);
      g.appendChild(btn);
    });
    return g;
  })()]));

  body.appendChild(h('div', {}, [h('label',{class:'form-label'},'Warna Tema'), (function(){
    const g = h('div', {class:'color-grid'});
    TEAM_COLORS.forEach(function(c){
      const btn = h('button', {class:'color-swatch' + (form.color===c?' selected':''), style:{background:GRAD_CSS[c]}, onclick:function(){ form.color=c; Array.from(g.children).forEach(function(x){x.classList.remove('selected');}); btn.classList.add('selected'); }});
      g.appendChild(btn);
    });
    return g;
  })()]));

  body.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px', marginTop:'4px'}, onclick:function(){
    if (!form.name.trim()) return;
    const newT = createTournament({
      name: form.name, format: form.format,
      teamCount: Math.max(2, Math.min(32, form.teamCount||2)),
      groupCount: Math.max(1, Math.min(8, form.groupCount||1)),
      emoji: form.emoji, color: form.color,
      halfMinutes: Math.max(1, Math.min(60, form.halfMinutes||10)),
      halves: form.halves===1 ? 1 : 2
    });
    state.tournaments.push(newT);
    state.activeId = newT.id;
    state.active = 'dashboard';
    state.showAddTournament = false;
    render();
  }}, [icon('trophy',17), 'Buat Turnamen']));

  body.appendChild(h('p', {class:'text-xs muted', style:{textAlign:'center', fontSize:'11px'}}, 'Tim, grup, dan bagan knockout akan otomatis dibuat sesuai pengaturan. Anda dapat mengedit semuanya setelahnya.'));

  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

/* =========================================================================
   SINKRONISASI FIREBASE (Firestore + Authentication)
   Siapa saja yang membuka link ini bisa LIHAT data live tanpa perlu login.
   Yang bisa MENGEDIT cuma admin yang berhasil login (lewat tombol "Mode
   Admin" di sidebar).

   CARA PAKAI:
   1) Buat/aktifkan project di https://console.firebase.google.com
   2) Aktifkan "Firestore Database" (Build > Firestore Database > Create).
   3) Aktifkan "Authentication" (Build > Authentication > Get Started) lalu
      pilih metode sign-in "Email/Password" dan aktifkan.
   4) Di tab "Users" Authentication, tambah SATU akun buat kamu sendiri
      (email + password) — ini yang dipakai untuk login sebagai admin di app.
   5) Project Settings > General > scroll ke "Your apps" > tambah Web App >
      copy objek firebaseConfig yang muncul, lalu isi FIREBASE_CONFIG di
      bawah ini.
   6) Di tab "Rules" pada Firestore, pakai contoh berikut — semua orang bisa
      BACA, tapi cuma yang login (admin) yang bisa MENULIS:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /miniSoccerTournament/{docId} {
              allow read: if true;
              allow write: if request.auth != null;
            }
          }
        }
   7) Host file HTML ini biar ada link yang bisa dibuka orang lain (mis.
      `firebase deploy` pakai Firebase Hosting, atau Netlify/GitHub Pages).
      Semua orang yang buka link itu otomatis sinkron & bisa lihat live,
      tapi cuma kamu (yang login pakai akun dari langkah 4) yang bisa edit.
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA5bwsgDkl0uzfIAJg5Dw65Oa3FmEgeUV4",
  authDomain: "turnament-arka.firebaseapp.com",
  projectId: "turnament-arka",
  storageBucket: "turnament-arka.firebasestorage.app",
  messagingSenderId: "878051104878",
  appId: "1:878051104878:web:28724533e2b788200f2e7f"
};
const FB_COLLECTION = 'miniSoccerTournament';
const FB_DOC = 'sharedState';
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('GANTI') === -1);

let fbDb = null, fbReady = false, fbApplyingRemote = false, fbSaveTimer = null;
let fbStatus = FIREBASE_ENABLED ? 'connecting' : 'disabled';
let fbUser = null;

function fbSnapshotData(){
  return { tournaments: state.tournaments, activeId: state.activeId, savedAt: Date.now() };
}
let localDataSavedAt = 0; // waktu data lokal terakhir disimpan — dipakai buat menolak data server yang lebih basi
function fbApplySnapshot(data){
  if (!data || !Array.isArray(data.tournaments) || data.tournaments.length===0) return true;
  // Kalau data dari server ternyata LEBIH LAMA dari data yang sudah kita punya secara lokal
  // (mis. baru saja refresh sebelum tulisan sempat sampai ke server karena koneksi lambat),
  // JANGAN ditimpa — pertahankan data lokal yang lebih baru dan biarkan penulisan berikutnya
  // memperbaiki data di server. Ini yang mencegah "hasil pertandingan hilang pas refresh".
  if (data.savedAt && localDataSavedAt && data.savedAt < localDataSavedAt) return false;
  state.tournaments = data.tournaments;
  state.activeId = (data.activeId && data.tournaments.some(function(t){return t.id===data.activeId;})) ? data.activeId : data.tournaments[0].id;
  if (data.savedAt) localDataSavedAt = data.savedAt;
  return true;
}
function fbStatusLabel(s){
  const labels = {
    disabled: 'Firebase belum diatur (data hanya tersimpan lokal)',
    connecting: 'Menyambungkan ke Firebase…',
    synced: 'Tersimpan otomatis ke Firebase',
    saving: 'Menyimpan perubahan…',
    error: 'Gagal terhubung ke Firebase',
  };
  return labels[s] || labels.disabled;
}
function setFbStatus(s){ fbStatus = s; updateFbStatusBadge(); }
function updateFbStatusBadge(){
  const el = document.getElementById('fb-status-el');
  if (!el) return;
  el.className = 'fb-status st-' + fbStatus;
  el.querySelector('.fb-status-text').textContent = fbStatusLabel(fbStatus);
}
function fbLogout(){
  if (!FIREBASE_ENABLED) return;
  firebase.auth().signOut();
  state.adminMode = false;
  render();
}
/* ---------- Local storage (biar data tetap ada walau di-refresh, tanpa perlu Firebase) ---------- */
const LOCAL_STORAGE_KEY = 'miniSoccerTournamentState_v1';
const THEME_STORAGE_KEY = 'miniSoccerTournamentTheme_v1';
function saveThemeToLocalStorage(){
  try{ localStorage.setItem(THEME_STORAGE_KEY, state.theme); }
  catch(err){ console.error('Gagal menyimpan tema ke penyimpanan lokal:', err); }
}
function loadThemeFromLocalStorage(){
  try{
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    if (saved === 'light' || saved === 'dark'){
      state.theme = saved;
      document.body.classList.toggle('theme-light', state.theme === 'light');
    }
  } catch(err){ console.error('Gagal memuat tema dari penyimpanan lokal:', err); }
}
function saveToLocalStorage(){
  try{
    const savedAt = Date.now();
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      tournaments: state.tournaments,
      activeId: state.activeId,
      savedAt: savedAt
    }));
    localDataSavedAt = savedAt;
  } catch(err){ console.error('Gagal menyimpan ke penyimpanan lokal:', err); }
}
function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.tournaments) || data.tournaments.length===0) return false;
    state.tournaments = data.tournaments;
    state.activeId = (data.activeId && data.tournaments.some(function(t){return t.id===data.activeId;}))
      ? data.activeId
      : data.tournaments[0].id;
    localDataSavedAt = data.savedAt || 0; // dipakai buat menolak data server yang lebih basi setelah refresh
    return true;
  } catch(err){ console.error('Gagal memuat dari penyimpanan lokal:', err); return false; }
}
let fbWritePending = false; // true dari saat ada perubahan lokal sampai tulisannya benar-benar sampai ke server
function scheduleSave(){
  // Selalu simpan ke localStorage browser ini, apa pun status Firebase-nya.
  saveToLocalStorage();
  // Hanya admin yang login yang boleh menulis ke Firestore — pengunjung biasa
  // cuma baca (real-time listener), sesuai Firestore Rules di komentar atas.
  if (!FIREBASE_ENABLED || !fbReady || fbApplyingRemote || !fbUser) return;
  setFbStatus('saving');
  fbWritePending = true; // sejak sekarang sampai tulisan ini sukses, abaikan snapshot masuk yang lebih lama
  clearTimeout(fbSaveTimer);
  fbSaveTimer = setTimeout(function(){
    const payload = fbSnapshotData();
    // Firestore membatasi 1 MB per dokumen. Kalau kelewat (biasanya karena logo
    // terlalu besar), tulisannya akan ditolak — beri tahu, jangan gagal diam-diam.
    const approxBytes = new Blob([JSON.stringify(payload)]).size;
    if (approxBytes > 900000){
      setFbStatus('error');
      fbWritePending = false;
      console.error('Data terlalu besar untuk Firestore:', approxBytes, 'byte (batas 1 MB).');
      alert('Data turnamen sudah terlalu besar (' + Math.round(approxBytes/1024) + ' KB, batas 1 MB) sehingga gagal disimpan ke cloud.\n\nBiasanya ini karena terlalu banyak logo tim. Coba hapus beberapa logo yang tidak terpakai. Data tetap tersimpan di browser ini.');
      return;
    }
    fbDb.collection(FB_COLLECTION).doc(FB_DOC).set(payload)
      .then(function(){ setFbStatus('synced'); fbWritePending = false; })
      .catch(function(err){ console.error('Gagal menyimpan ke Firebase:', err); setFbStatus('error'); fbWritePending = false; });
  }, 700);
}
function initFirebase(){
  if (!FIREBASE_ENABLED){ render(); ensureLiveTimer(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
  } catch(err){
    console.error('Firebase init error:', err);
    setFbStatus('error'); render(); ensureLiveTimer(); return;
  }
  firebase.auth().onAuthStateChanged(function(user){
    fbUser = user;
    if (!user) state.adminMode = false;
    safeRender();
  });
  const docRef = fbDb.collection(FB_COLLECTION).doc(FB_DOC);
  docRef.get().then(function(snap){
    if (snap.exists){
      fbApplyingRemote = true;
      const applied = fbApplySnapshot(snap.data());
      fbApplyingRemote = false;
      if (!applied && fbUser){
        // Data di server ternyata lebih basi dari data lokal kita (mis. sempat refresh sebelum
        // tulisan sebelumnya sampai ke server) — kirim ulang data lokal yang benar ke server.
        scheduleSave();
      }
    } else if (fbUser){
      // Hanya admin yang sudah login yang bisa membuat dokumen data awal.
      docRef.set(fbSnapshotData()).catch(function(err){ console.error('Gagal membuat data awal di Firebase:', err); });
    }
    fbReady = true; setFbStatus('synced');
    safeRender(); ensureLiveTimer();
    docRef.onSnapshot(function(snap){
      if (!snap.exists) return;
      // Kalau ada perubahan lokal yang belum selesai terkirim ke server (mis. baru
      // saja klik "Simpan Gol"/"Simpan Kartu"), JANGAN timpa dulu dengan data lama
      // dari snapshot ini — nanti begitu tulisan lokal kelar, snapshot barunya yang
      // sudah termasuk perubahan itu akan datang dan diterapkan seperti biasa.
      if (fbWritePending) return;
      fbApplyingRemote = true;
      const applied = fbApplySnapshot(snap.data());
      fbApplyingRemote = false;
      if (!applied && fbUser){ scheduleSave(); return; }
      safeRender();
    }, function(err){
      console.error('Firebase realtime sync error:', err);
      setFbStatus('error');
    });
  }).catch(function(err){
    console.error('Firebase get error:', err);
    setFbStatus('error'); fbReady = true; render(); ensureLiveTimer();
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
loadFromLocalStorage();
loadThemeFromLocalStorage();
render(); // tampilkan data lokal dulu biar halaman tidak blank sambil menunggu Firebase
ensureLiveTimer();
initFirebase();

// Peringatkan kalau mau menutup/refresh halaman padahal masih ada data yang belum sempat
// terkirim ke server — supaya tidak diam-diam hilang karena buru-buru refresh.
window.addEventListener('beforeunload', function(e){
  if (fbWritePending){
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
