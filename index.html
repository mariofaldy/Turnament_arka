<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copa de Mini Soccer — Dashboard Turnamen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --blue:#22c55e; --blue-l:#4ade80; --purple:#f59e0b; --purple-l:#fbbf24;
    --red:#f43f5e; --yellow:#fde047; --green:#2dd4bf; --muted:#93a89d; --text:#eaf5ee;
    --border: rgba(180,255,205,.09); --panel: linear-gradient(180deg, rgba(180,255,205,.045), rgba(180,255,205,.014));
    --surface-1: rgba(255,255,255,.03); --surface-2: rgba(255,255,255,.04); --surface-3: rgba(255,255,255,.05);
    --surface-hover: rgba(255,255,255,.06); --surface-strong: rgba(255,255,255,.14); --switch-on-bg: rgba(255,255,255,.9);
    --body-bg-solid: #070c09; --pattern-line: rgba(180,255,205,.025);
    --sidebar-grad-1: rgba(12,18,14,.98); --sidebar-grad-2: rgba(7,11,8,.98);
    --modal-grad-1: rgba(16,22,17,.98); --modal-grad-2: rgba(9,13,10,.98);
    --overlay-dim: rgba(0,0,0,.6); --modal-overlay-bg: rgba(0,0,0,.7);
    --select-bg: #111318; --logo-upload-bg: #1e293b; --switch-off-bg: #334155;
    --text-2: #cbd5e1; --text-3: #94a3b8; --text-4: #64748b; --text-5: #475569;
    --text-heading: #f1f5f9; --text-strong: #f8fafc;
    --acc-green-text: #86efac; --acc-amber-text: #fde68a; --acc-red-text: #fca5a5;
    --acc-teal-text: #5eead4; --acc-green-text2: #bbf7d0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; color:var(--text); min-height:100vh; position:relative;
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(34,197,94,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(245,158,11,.13), transparent 55%),
      radial-gradient(700px 400px at 50% 100%, rgba(45,212,191,.06), transparent 60%),
      var(--body-bg-solid);
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(115deg, var(--pattern-line) 0px, var(--pattern-line) 2px, transparent 2px, transparent 64px);
    opacity:.5;
  }
  #root{position:relative; z-index:1;}
  .disp{font-family:'Rajdhani',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  /* layout */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:280px; flex-shrink:0; display:flex; flex-direction:column;
    background:linear-gradient(180deg, var(--sidebar-grad-1), var(--sidebar-grad-2));
    border-right:1px solid var(--border);
    position:fixed; top:0; left:0; height:100vh; transform:translateX(-100%);
    transition:transform .25s ease; z-index:50; overflow-y:auto;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:var(--overlay-dim); z-index:40;}
  .sidebar-overlay.show{display:block;}
  .main-wrap{flex:1; display:flex; flex-direction:column; min-width:0;}
  @media(min-width:1024px){
    .sidebar{position:fixed; transform:none; height:100vh;}
    .main-wrap{margin-left:280px;}
    .sidebar-overlay{display:none !important;}
    .hamburger{display:none !important;}
  }

  .scrollbar::-webkit-scrollbar{width:6px; height:6px;}
  .scrollbar::-webkit-scrollbar-thumb{background:var(--surface-strong); border-radius:99px;}
  .scrollbar::-webkit-scrollbar-track{background:transparent;}

  /* utility */
  .flex{display:flex;} .flex-col{display:flex; flex-direction:column;}
  .items-center{align-items:center;} .justify-between{justify-content:space-between;} .justify-center{justify-content:center;}
  .flex-1{flex:1;} .flex-wrap{flex-wrap:wrap;} .shrink-0{flex-shrink:0;} .min-w-0{min-width:0;}
  .gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-5{gap:20px;} .gap-6{gap:24px;}
  .truncate{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .text-xs{font-size:11px;} .text-sm{font-size:13px;} .text-base{font-size:15px;} .text-lg{font-size:18px;} .text-xl{font-size:22px;}
  .font-bold{font-weight:700;} .font-semibold{font-weight:600;} .font-medium{font-weight:500;}
  .muted{color:var(--muted);}
  .rounded{border-radius:8px;} .rounded-lg{border-radius:10px;} .rounded-xl{border-radius:14px;} .rounded-2xl{border-radius:18px;} .rounded-full{border-radius:999px;}
  .w-full{width:100%;}
  .mt-1{margin-top:4px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;}
  .mb-1{margin-bottom:4px;} .mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;}
  .uppercase{text-transform:uppercase;} .tracking{letter-spacing:.04em;}
  .grid{display:grid;}
  .icon-wrap{display:inline-flex; align-items:center; justify-content:center; line-height:0;}

  /* header */
  .header{display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); backdrop-filter:blur(10px); flex-wrap:wrap;}
  .hamburger{background:none; border:none; color:var(--text-2);}
  .search-box{position:relative; width:100%; max-width:260px;}
  .search-box input{width:100%; background:var(--surface-3); border:1px solid var(--border); border-radius:999px; padding:8px 12px 8px 32px; color:var(--text); font-size:13px;}
  .search-box input::placeholder{color:var(--muted);}
  .search-box .icon-wrap{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted);}
  .tourn-switch{display:flex; align-items:center; gap:6px; background:var(--surface-3); border:1px solid var(--border); border-radius:999px; padding:6px 6px 6px 12px;}
  .tourn-switch select{background:transparent; border:none; color:var(--text); font-size:13px; outline:none;}
  .tourn-switch select option{background:var(--select-bg);}
  .bell{position:relative; background:none; border:none; color:var(--text-2);}
  .bell .badge{position:absolute; top:-6px; right:-6px; height:16px; width:16px; border-radius:50%; background:linear-gradient(135deg,var(--purple),#f97316); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .avatar-admin{height:36px; width:36px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;}

  /* sidebar content */
  .sb-top{display:flex; align-items:center; justify-content:space-between; padding:22px 18px 16px; border-bottom:1px solid var(--border);}
  .sb-logo-name{font-weight:700; font-size:15px; background:linear-gradient(90deg,var(--blue-l),var(--purple-l)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sb-close{display:none; background:none; border:none; color:var(--text-3);}
  @media(max-width:1023px){.sb-close{display:block;}}
  .new-tourn-btn{margin:14px 16px; width:calc(100% - 32px); display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed rgba(34,197,94,.4); background:rgba(34,197,94,.1); color:var(--acc-green-text); border-radius:12px; padding:10px; font-size:12px; font-weight:600;}
  .nav{padding:8px 12px; display:flex; flex-direction:column; gap:4px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid transparent; background:none; color:var(--text-3); font-size:13px; font-weight:500; text-align:left; transition:background .15s ease, color .15s ease, transform .15s ease;}
  .nav-item:hover{color:var(--text-heading); background:rgba(180,255,205,.06); transform:translateX(2px);}
  .nav-item.active{background:linear-gradient(90deg, rgba(34,197,94,.2), rgba(245,158,11,.2)); border-color:rgba(34,197,94,.4); color:var(--text-strong);}
  .nav-item.active .icon-wrap{color:var(--blue-l);}
  .nav-item .chev{margin-left:auto; color:var(--blue-l);}
  .sb-bottom{padding:16px; border-top:1px solid var(--border); margin-top:auto;}
  .admin-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-strong); font-weight:600; font-size:13px;}
  .admin-toggle.on{background:linear-gradient(90deg,var(--blue),var(--purple)); border:none; box-shadow:0 10px 25px -8px rgba(245,158,11,.5);}
  .switch{height:20px; width:36px; border-radius:99px; background:var(--switch-off-bg); display:flex; align-items:center; padding:2px;}
  .switch.on{background:var(--switch-on-bg); justify-content:flex-end;}
  .switch .dot{height:16px; width:16px; border-radius:50%; background:var(--text-3);}
  .switch.on .dot{background:var(--blue);}
  .sb-hint{font-size:11px; color:var(--muted); margin-top:8px; padding:0 2px;}

  /* main content */
  .main{flex:1; padding:20px; overflow-y:auto;}
  .admin-banner{display:flex; align-items:center; gap:8px; border:1px solid rgba(34,197,94,.4); background:rgba(34,197,94,.1); color:var(--acc-green-text2); border-radius:12px; padding:10px 16px; font-size:12px; margin-bottom:18px;}

  /* panels */
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:20px; backdrop-filter:blur(10px); transition:border-color .2s ease, transform .2s ease;}
  .panel:hover{border-color:rgba(180,255,205,.16);}
  .panel-glow-blue{box-shadow:0 0 0 1px rgba(34,197,94,.18), 0 20px 60px -20px rgba(34,197,94,.35); border:1px solid rgba(34,197,94,.35);}
  .panel-glow-purple{box-shadow:0 0 0 1px rgba(245,158,11,.18), 0 20px 60px -20px rgba(245,158,11,.35); border:1px solid rgba(245,158,11,.32);}
  .section-title{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .section-title h3{margin:0; font-size:17px; font-weight:600;}
  .section-title .spacer{flex:1;}

  /* dashboard grid */
  .dash-grid{display:grid; grid-template-columns:repeat(12,1fr); gap:20px;}
  .col-left{grid-column: span 12; display:flex; flex-direction:column; gap:20px;}
  .col-right{grid-column: span 12; display:flex; flex-direction:column; gap:20px;}
  @media(min-width:1024px){
    .col-left{grid-column: span 8;}
    .col-right{grid-column: span 4;}
  }
  .two-col{display:grid; grid-template-columns:1fr; gap:20px;}
  @media(min-width:640px){.two-col{grid-template-columns:1fr 1fr;}}

  /* live scoreboard */
  .live-panel{position:relative; overflow:hidden;}
  .live-glow-a{position:absolute; top:-70px; right:-70px; height:210px; width:210px; background:var(--blue); opacity:.1; border-radius:50%; filter:blur(50px); pointer-events:none;}
  .live-glow-b{position:absolute; bottom:-70px; left:-70px; height:210px; width:210px; background:var(--purple); opacity:.1; border-radius:50%; filter:blur(50px); pointer-events:none;}
  .live-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:relative; flex-wrap:wrap; gap:8px;}
  .live-dot{height:10px; width:10px; border-radius:50%; background:var(--red); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55);} 70%{box-shadow:0 0 0 9px rgba(244,63,94,0);} 100%{box-shadow:0 0 0 0 rgba(244,63,94,0);}}
  .live-label{color:var(--red); font-weight:700; font-size:13px; letter-spacing:.15em;}
  .pause-btn{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-2); border:1px solid var(--border); border-radius:999px; padding:5px 12px; background:none;}
  /* Dipakai di banyak tempat: klasemen fair play, tombol pilih jenis kartu di modal, dll */
  .card-chip{display:flex; align-items:center; gap:4px;}
  .card-y{height:13px; width:9px; border-radius:2px; background:var(--yellow); display:inline-block; flex-shrink:0;}
  .card-r{height:13px; width:9px; border-radius:2px; background:var(--red); display:inline-block; flex-shrink:0;}

  /* Dipakai oleh buildEventList() di halaman Jadwal (detail gol/kartu pertandingan selesai) */
  .scorer-list{font-size:11px; color:var(--text-4); margin-top:4px; max-width:100%; overflow:hidden;}
  .scorer-list p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* Dipakai untuk logo/emoji turnamen di sidebar (ukuran & bentuknya di-override inline) */
  .team-crest{display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0;}

  /* ---- Live Scoreboard (kartu skor gaya "match center") ---- */
  .live-scoreboard{position:relative; overflow:hidden; border-radius:18px; padding:22px 16px 18px;
    background:linear-gradient(160deg,#171933 0%,#1f1b42 45%,#2c1a40 100%);}
  .ls-glow{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none; opacity:.5;}
  .ls-glow-a{top:-60px; left:-40px; height:180px; width:180px; background:var(--blue);}
  .ls-glow-b{bottom:-60px; right:-40px; height:180px; width:180px; background:var(--purple);}
  .ls-meta{position:relative; text-align:center; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:14px;}
  .ls-main{position:relative; display:flex; align-items:flex-start; justify-content:center; gap:10px;}
  .ls-team{display:flex; flex-direction:column; align-items:center; width:84px; min-width:0; flex-shrink:0;}
  .ls-crest{height:44px; width:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14), 0 8px 20px -6px rgba(0,0,0,.5); flex-shrink:0;}
  .ls-crest.a{background:linear-gradient(135deg,var(--blue),#15803d);}
  .ls-crest.b{background:linear-gradient(135deg,var(--purple),#b45309);}
  .ls-crest img{height:100%; width:100%; border-radius:50%; object-fit:cover;}
  .ls-team-name{margin-top:8px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; color:#fff; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .ls-team-name input.inline-edit{color:#fff; text-align:center; font-size:12.5px;}
  .ls-cards{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:5px; font-size:9.5px;}
  .ls-score{display:flex; flex-direction:column; align-items:center; padding:0 6px; flex-shrink:0;}
  .ls-score-nums{display:flex; align-items:center; gap:8px; font-family:'Rajdhani',sans-serif; font-size:34px; font-weight:700; color:#fff; line-height:1;}
  .ls-score-nums input.inline-edit-num{color:#fff; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.25); font-size:inherit; width:1.3em;}
  .ls-score-sep{color:rgba(255,255,255,.35);}
  .ls-clock{margin-top:9px; display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--acc-amber-text); background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.3); border-radius:999px; padding:4px 10px; white-space:nowrap;}
  .ls-half{margin-top:4px; font-size:9.5px; color:rgba(255,255,255,.45);}
  .ls-divider{position:relative; height:1px; background:rgba(255,255,255,.1); margin:16px 0 12px;}
  .ls-events{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .ls-events-col{min-width:0;}
  .ls-events-col.side-b{text-align:right;}
  .ls-event-row{display:flex; align-items:center; gap:5px; font-size:10.5px; color:rgba(255,255,255,.75); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ls-events-col.side-b .ls-event-row{flex-direction:row-reverse;}
  .ls-event-row input.inline-edit, .ls-event-row input.inline-edit-num{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#fff;}
  .ls-event-row .icon-btn{color:rgba(255,255,255,.5);}
  .ls-empty-events{font-size:10px; color:rgba(255,255,255,.35); font-style:italic;}
  .ls-add-btns{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .ls-events-col.side-b .ls-add-btns{justify-content:flex-end;}
  .ls-add-btn{display:flex; align-items:center; gap:4px; font-size:10px; padding:5px 9px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:rgba(255,255,255,.85); cursor:pointer;}
  .ls-add-btn:hover{background:rgba(255,255,255,.15);}
  @media(min-width:480px){
    .ls-team{width:100px;}
    .ls-crest{height:52px; width:52px; font-size:16px;}
    .ls-team-name{font-size:13.5px;}
    .ls-score-nums{font-size:40px;}
  }
  @media(min-width:900px){
    .live-scoreboard{padding:30px 26px 24px;}
    .ls-team{width:150px;}
    .ls-crest{height:64px; width:64px; font-size:20px;}
    .ls-team-name{font-size:15px; margin-top:10px;}
    .ls-score-nums{font-size:52px; gap:14px;}
    .ls-clock{font-size:12px; padding:5px 12px;}
    .ls-event-row{font-size:12px;}
    .ls-divider{margin:22px 0 16px;}
  }

  /* ---- Klasemen Grup (hasil pertandingan + tabel gaya "match center") ---- */
  .gs-panel{padding:0; overflow:hidden;}
  .gs-hero{position:relative; overflow:hidden; padding:22px 20px 18px; background:linear-gradient(135deg,#0b1130 0%,#151b45 55%,#1c1440 100%);}
  .gs-hero-glow{position:absolute; top:-80px; right:-60px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(245,158,11,.35), transparent 70%); filter:blur(20px); pointer-events:none;}
  .gs-hero-top{position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .gs-hero-eyebrow{font-size:10.5px; letter-spacing:.25em; color:var(--acc-amber-text); font-weight:700; margin:0 0 4px;}
  .gs-hero-title{font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:800; color:#fff; margin:0; letter-spacing:.02em; line-height:1.15; word-break:break-word;}
  .gs-hero-trophy{color:var(--acc-amber-text); flex-shrink:0; opacity:.9;}
  .gs-hero-badge{position:relative; display:inline-flex; align-items:center; margin-top:14px; padding:6px 16px; background:linear-gradient(135deg,#dc2626,#991b1b); border-radius:8px; font-family:'Rajdhani',sans-serif; font-weight:800; font-size:14px; color:#fff; letter-spacing:.04em;}
  .gs-tabs-wrap{padding:14px 18px 0;}
  .gs-cols{display:grid; grid-template-columns:1fr; gap:16px; padding:18px;}
  @media(min-width:900px){ .gs-cols{grid-template-columns:1fr 1.15fr;} }
  .gs-results{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .gs-results-head, .gs-table-head{font-weight:800; font-size:11.5px; letter-spacing:.08em; text-align:center; padding:9px; text-transform:uppercase; color:#fff;}
  .gs-results-head{background:linear-gradient(135deg,#f59e0b,#d97706); color:#1c1207;}
  .gs-table-head{background:linear-gradient(135deg,#1e3a8a,#0f172a);}
  .gs-matchday-label{font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; padding:10px 12px 4px;}
  .gs-match-card{margin:0 12px 10px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); border-radius:10px;}
  .gs-match-teams{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .gs-match-team{display:flex; align-items:center; gap:6px; min-width:0; flex:1;}
  .gs-match-team.right{flex-direction:row-reverse; text-align:right;}
  .gs-match-team-name{font-size:12px; font-weight:600; color:var(--text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gs-match-score{font-family:'Rajdhani',sans-serif; font-weight:800; font-size:15px; color:var(--text-strong); background:var(--surface-3); padding:3px 10px; border-radius:6px; flex-shrink:0;}
  .gs-match-scorers{margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:3px 8px; font-size:9.5px; color:var(--muted);}
  .gs-match-scorers .side-a{text-align:left;}
  .gs-match-scorers .side-b{text-align:right;}
  .gs-match-empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:12px;}
  .gs-table-wrap{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .gs-table-inner table{width:100%; border-collapse:collapse; font-size:11px;}
  .gs-table-inner th{padding:8px 5px; color:var(--muted); font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); white-space:nowrap;}
  .gs-table-inner td{padding:7px 5px; border-bottom:1px solid var(--border);}
  .gs-pos-badge{display:inline-flex; align-items:center; justify-content:center; height:21px; width:21px; border-radius:50%; font-weight:800; font-size:10.5px; color:#fff; background:var(--surface-3);}
  .gs-pos-badge.gold{background:linear-gradient(135deg,#f59e0b,#b45309);}
  .gs-pos-badge.silver{background:linear-gradient(135deg,#e2e8f0,#94a3b8); color:#1e293b;}
  .gs-pos-badge.bronze{background:linear-gradient(135deg,#d97706,#78350f);}
  .gs-row-winner{background:rgba(245,158,11,.08);}
  .gs-status-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:14px; border-top:1px solid var(--border);}
  .gs-status-card{text-align:center; padding:14px 8px; border-radius:12px; border:1px solid var(--border);}
  .gs-status-card.gold{background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.35);}
  .gs-status-card.silver{background:rgba(148,163,184,.1); border-color:rgba(148,163,184,.35);}
  .gs-status-card.bronze{background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.35);}
  .gs-status-card.out{background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.3);}
  .gs-status-icon{margin:0 auto 6px;}
  .gs-status-team{font-weight:700; font-size:11.5px; color:var(--text-heading); margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gs-status-label{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin:0 0 2px;}
  .gs-status-note{font-size:9px; color:var(--muted); margin:0;}

  /* editable */
  input, select, button, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  .inline-edit{
    background:rgba(34,197,94,.1); border:1.5px solid rgba(34,197,94,.45); outline:none; border-radius:7px;
    color:var(--text); padding:2px 6px; min-width:40px; box-sizing:border-box; transition:border-color .15s, background .15s;
  }
  .inline-edit:focus{border-color:var(--blue-l); background:rgba(34,197,94,.18);}
  .inline-edit.text-wide{width:100%;}
  .inline-edit-num{
    background:rgba(245,158,11,.1); border:1.5px solid rgba(245,158,11,.45); outline:none; border-radius:7px;
    color:var(--text); text-align:center; padding:2px 4px; width:3.6em; box-sizing:border-box; transition:border-color .15s, background .15s;
  }
  .inline-edit-num:focus{border-color:var(--purple-l); background:rgba(245,158,11,.18);}
  .text-green{color:var(--green);}
  .text-red{color:var(--red);}

  /* match stats */
  .stat-block{margin-bottom:16px;}
  .stat-block:last-child{margin-bottom:0;}
  .stat-labels{display:flex; align-items:center; justify-content:space-between; font-size:11px; margin-bottom:6px;}
  .stat-track{height:8px; width:100%; border-radius:99px; background:var(--surface-3); overflow:hidden; display:flex;}
  .stat-fill-a{height:100%; background:linear-gradient(90deg,var(--blue),var(--blue-l));}
  .stat-fill-b{height:100%; background:linear-gradient(90deg,var(--purple-l),var(--purple));}

  /* table */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead tr{border-bottom:1px solid var(--border);}
  th{text-align:left; padding:8px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:500;}
  td{padding:9px 6px; border-bottom:1px solid var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .rank-badge{height:24px; width:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--surface-3); color:var(--text-3);}
  .rank-badge.top{background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff;}
  .row-top{background:rgba(34,197,94,.05);}
  .group-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .group-tab{font-size:11px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--text-3);}
  .group-tab.active{border-color:rgba(245,158,11,.5); background:rgba(245,158,11,.2); color:var(--acc-amber-text);}

  /* bracket */
  .bracket-round{margin-bottom:20px;}
  .bracket-round:last-child{margin-bottom:0;}
  .bracket-round-name{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .bracket-matches{display:grid; grid-template-columns:1fr; gap:8px;}
  .bracket-note{font-size:9.5px; color:rgba(255,255,255,.5);}

  /* ---- Bagan Turnamen: poster ungu bergaya "bagan sepak bola" ---- */
  .bracket-poster{position:relative; overflow:hidden; padding:0; border:none; box-shadow:none;}
  .bracket-poster-inner{position:relative; overflow:hidden; border-radius:18px; padding:24px 18px 20px; background:linear-gradient(150deg,#2a1454 0%,#3d1a6b 45%,#1f0f3d 100%);}
  .bp-glow-a{position:absolute; top:-70px; left:-50px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(245,158,11,.28), transparent 70%); filter:blur(10px); pointer-events:none;}
  .bp-glow-b{position:absolute; bottom:-70px; right:-50px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(168,85,247,.35), transparent 70%); filter:blur(10px); pointer-events:none;}
  .bp-corner{position:absolute; width:140px; height:140px; background:rgba(255,255,255,.03); pointer-events:none;}
  .bp-corner.tl{top:0; left:0; clip-path:polygon(0 0, 100% 0, 0 100%);}
  .bp-corner.br{bottom:0; right:0; clip-path:polygon(100% 100%, 0 100%, 100% 0);}
  .bracket-poster-head{position:relative; text-align:center; margin-bottom:18px;}
  .bracket-poster-eyebrow{font-size:10px; letter-spacing:.28em; color:rgba(255,255,255,.55); font-weight:700; text-transform:uppercase; margin:0 0 4px;}
  .bracket-poster-title{font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:800; color:#fff; margin:0; word-break:break-word;}
  .bracket-poster-round-badge{display:inline-flex; align-items:center; gap:6px; margin-top:11px; padding:5px 16px; background:rgba(245,158,11,.16); border:1px solid rgba(245,158,11,.4); border-radius:999px; font-size:10.5px; font-weight:800; letter-spacing:.12em; color:var(--acc-amber-text); text-transform:uppercase;}
  .bracket-tree-scroll{overflow-x:auto; overflow-y:hidden; padding-bottom:10px; position:relative;}
  .bracket-tree-header{display:flex; position:relative;}
  .bracket-tree-header .col-label{flex-shrink:0; font-size:11px; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px; padding-bottom:14px; color:rgba(255,255,255,.55);}
  .bracket-tree{position:relative;}
  .bracket-champion-col{flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
  .bracket-match{position:relative; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:9px; display:flex; flex-direction:column; gap:5px; backdrop-filter:blur(6px);}
  .bracket-tree .bracket-match{position:absolute; margin:0;}
  .bracket-tree .bracket-match:hover{border-color:rgba(245,158,11,.55);}
  .bracket-team-row{display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:8px; background:rgba(255,255,255,.92);}
  .bracket-team-crest{height:20px; width:20px; border-radius:50%; flex-shrink:0; object-fit:cover;}
  .bracket-team-crest-fallback{height:20px; width:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; font-weight:700;}
  .bracket-team-name{font-size:11.5px; font-weight:700; color:#211a3a; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bracket-team-row .inline-edit-num{background:rgba(0,0,0,.06); border-color:rgba(0,0,0,.15); color:#211a3a; width:28px; flex-shrink:0;}
  .bracket-winner-row{background:linear-gradient(135deg,#fde68a,#f59e0b); box-shadow:0 4px 14px -4px rgba(245,158,11,.6);}
  .bracket-winner-row .bracket-team-name{color:#3a2405;}
  .bracket-line-h{position:absolute; height:2px; background:linear-gradient(90deg, rgba(245,158,11,.55), rgba(245,158,11,.25)); margin-top:-1px;}
  .bracket-line-v{position:absolute; width:2px; background:rgba(245,158,11,.4); margin-left:-1px;}
  .bracket-champion-card{background:linear-gradient(160deg, rgba(245,158,11,.28), rgba(124,58,237,.18)); border:1.5px solid rgba(245,158,11,.55); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 20px 50px -20px rgba(245,158,11,.5); min-width:150px; color:#fff;}
  .bracket-champion-card .cc-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--acc-amber-text);}
  .bracket-champion-card .cc-name{font-size:15px; font-weight:700; color:#fff; text-align:center;}
  .bracket-champion-card.pending{opacity:.5; border-style:dashed;}

  /* ---- Bagan V (2 semifinal -> final), niru poster referensi ---- */
  .bp-v-wrap{display:flex; align-items:center; justify-content:center; position:relative; padding:8px 0 4px; gap:0;}
  .bp-v-side{position:relative; flex-shrink:0;}
  .bp-v-team-box{position:relative; z-index:2; background:rgba(255,255,255,.94); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:8px;}
  .bp-v-team-box.winner{background:linear-gradient(135deg,#fde68a,#f59e0b); box-shadow:0 4px 14px -4px rgba(245,158,11,.6);}
  .bp-v-team-box.mirrored .bp-v-name{text-align:right;}
  .bp-v-team-box.placeholder{background:rgba(255,255,255,.55);}
  .bp-v-team-box.placeholder .bp-v-name{font-style:italic; color:#4b4468;}
  .bp-v-team-box .bp-v-name{font-weight:700; font-size:12.5px; color:#211a3a; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bp-v-mid-label{position:absolute; z-index:2; left:50%; transform:translate(-50%,-50%); font-size:9.5px; color:rgba(255,255,255,.55); white-space:nowrap; background:linear-gradient(150deg,#2a1454,#3d1a6b); padding:2px 6px;}
  .bp-v-btn-wrap{position:absolute; z-index:2; left:50%; transform:translateX(-50%); white-space:nowrap;}
  .bp-v-center{flex-shrink:0; padding:0 14px; position:relative; z-index:2; width:150px;}
  .bp-v-center-stack{position:absolute; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:5px; width:150px;}
  .bp-v-center-label{font-family:'Rajdhani',sans-serif; font-weight:800; font-size:17px; color:#fff; letter-spacing:.06em; margin-top:2px;}
  .bp-v-center-sub{font-size:9.5px; color:rgba(255,255,255,.55); text-align:center; max-width:130px;}
  .bp-v-center-score{margin-top:2px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:8px; padding:5px 14px; font-weight:800; color:#fff; font-size:13px; font-family:'Rajdhani',sans-serif;}

  /* players */
  .player-list{display:flex; flex-direction:column; gap:12px;}
  .player-row{display:flex; align-items:center; gap:10px;}
  .avatar-circle{height:36px; width:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; flex-shrink:0;}
  .avatar-blue{background:linear-gradient(135deg,var(--blue),#15803d);}
  .avatar-purple{background:linear-gradient(135deg,var(--purple),#b45309);}

  /* fairplay */
  .fp-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--surface-2);}
  .fp-row:last-child{border-bottom:none;}

  /* schedule/news */
  .sched-item{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .status-pill{font-size:9.5px; padding:3px 8px; border-radius:999px; font-weight:600;}
  .status-live{background:rgba(244,63,94,.2); color:var(--acc-red-text);}
  .status-upcoming{background:rgba(34,197,94,.2); color:var(--acc-green-text);}
  .status-finished{background:rgba(45,212,191,.2); color:var(--acc-teal-text);}
  .news-item{display:flex; gap:10px; margin-bottom:12px;}
  .news-thumb{height:48px; width:48px; border-radius:10px; background:linear-gradient(135deg, rgba(34,197,94,.3), rgba(245,158,11,.3)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-2);}

  /* teams page */
  .team-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media(min-width:640px){.team-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1024px){.team-grid{grid-template-columns:repeat(4,1fr);}}
  .team-card{position:relative; border-radius:14px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease;}
  .team-card:hover{transform:translateY(-2px); border-color:rgba(180,255,205,.22); background:var(--surface-hover);}
  .team-card.selected{border-color:rgba(34,197,94,.5); background:rgba(34,197,94,.1);}
  .team-crest-lg{height:56px; width:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; position:relative;}
  .team-crest-lg img{height:56px; width:56px; border-radius:16px; object-fit:cover;}
  .logo-upload-btn{position:absolute; bottom:-4px; right:-4px; height:24px; width:24px; border-radius:50%; background:var(--logo-upload-bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-2); cursor:pointer; padding:0; transition:background .15s ease, transform .15s ease;}
  .logo-upload-btn:hover{background:var(--surface-strong); transform:scale(1.12);}
  .team-card-remove{position:absolute; top:6px; right:6px; color:var(--text-4); background:none; border:none;}
  .team-card-remove:hover{color:var(--red);}

  /* buttons / forms */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; font-size:13px; font-weight:600; padding:9px 16px; border:none; transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;}
  .btn:hover{transform:translateY(-1px); filter:brightness(1.08);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:linear-gradient(90deg,var(--blue),var(--purple)); color:#fff; box-shadow:0 10px 25px -8px rgba(245,158,11,.4);}
  .btn-primary:hover{box-shadow:0 14px 30px -10px rgba(245,158,11,.55);}
  .btn-ghost-blue{color:var(--acc-green-text); border:1px solid rgba(34,197,94,.4); background:rgba(34,197,94,.1); font-size:12px; padding:7px 12px;}
  .btn-ghost-purple{color:var(--acc-amber-text); border:1px solid rgba(245,158,11,.4); background:rgba(245,158,11,.1); font-size:12px; padding:7px 12px;}
  .btn-ghost-red{color:var(--acc-red-text); border:1px solid rgba(244,63,94,.4); background:rgba(244,63,94,.1); font-size:11px; padding:5px 10px;}
  .btn-ghost-green{color:var(--acc-teal-text); border:1px solid rgba(45,212,191,.4); background:rgba(45,212,191,.1); font-size:11px; padding:5px 10px;}
  .icon-btn{background:none; border:none; color:var(--text-4);}
  .icon-btn:hover{color:var(--red);}
  .form-input, select.form-input{width:100%; background:var(--surface-3); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:var(--text); font-size:13px; outline:none;}
  .form-input:focus{border-color:var(--blue);}
  input[type="date"].form-input, input[type="time"].form-input{color-scheme:dark; cursor:pointer;}
  input[type="date"].form-input::-webkit-calendar-picker-indicator,
  input[type="time"].form-input::-webkit-calendar-picker-indicator{filter:invert(.7); cursor:pointer;}
  body.theme-light input[type="date"].form-input, body.theme-light input[type="time"].form-input{color-scheme:light;}
  body.theme-light input[type="date"].form-input::-webkit-calendar-picker-indicator,
  body.theme-light input[type="time"].form-input::-webkit-calendar-picker-indicator{filter:none;}
  select.form-input option{background:var(--select-bg); color:var(--text);}
  .form-label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); margin-bottom:6px;}
  .form-row{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:640px){.form-row.cols-2{grid-template-columns:1fr 1fr;}}
  @media(min-width:1024px){.form-row.cols-5{grid-template-columns:repeat(5,1fr);}}
  .emoji-grid, .color-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .emoji-btn{height:36px; width:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; border:1px solid var(--border); background:var(--surface-2);}
  .emoji-btn.selected{border-color:var(--blue-l); background:rgba(34,197,94,.2);}
  .color-swatch{height:32px; width:32px; border-radius:10px; border:none;}
  .color-swatch.selected{outline:2px solid #fff;}

  /* modal */
  .modal-overlay{position:fixed; inset:0; background:var(--modal-overlay-bg); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal-box{background:linear-gradient(180deg, var(--modal-grad-1), var(--modal-grad-2)); border:1px solid var(--border); border-radius:18px; padding:24px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{margin:0; font-size:17px; font-weight:700; font-family:'Rajdhani',sans-serif;}
  .modal-close{background:none; border:none; color:var(--text-3);}

  /* fixtures page */
  .fixture-item{border:1px solid var(--border); background:var(--surface-2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  @media(min-width:640px){.fixture-item{flex-direction:row; align-items:center;}}
  .fixture-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  /* misc */
  .empty-state{text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .empty-icon{height:56px; width:56px; border-radius:16px; background:linear-gradient(135deg,var(--blue),var(--purple)); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 25px -8px rgba(245,158,11,.4);}

  /* import teams */
  .import-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface-1);}
  .import-thumb{height:32px; width:32px; border-radius:8px; flex-shrink:0;}

  /* ===================== TEMA TERANG ===================== */
  body.theme-light{
    --muted:#5b6b63; --text:#0f1e15;
    --border: rgba(15,40,25,.12);
    --panel: linear-gradient(180deg, rgba(15,40,25,.035), rgba(15,40,25,.012));
    --surface-1: rgba(15,40,25,.03); --surface-2: rgba(15,40,25,.045); --surface-3: rgba(15,40,25,.06);
    --surface-hover: rgba(15,40,25,.08); --surface-strong: rgba(15,40,25,.18); --switch-on-bg: #0f1e15;
    --pattern-line: rgba(15,40,25,.035);
    --sidebar-grad-1: #ffffff; --sidebar-grad-2: #f1f5f2;
    --modal-grad-1: #ffffff; --modal-grad-2: #f4f7f5;
    --overlay-dim: rgba(15,25,20,.35); --modal-overlay-bg: rgba(15,25,20,.45);
    --select-bg: #ffffff; --logo-upload-bg: #e6ece8; --switch-off-bg: #cbd5c9;
    --text-2:#3f4d46; --text-3:#5b6b63; --text-4:#6b7972; --text-5:#8a968f;
    --text-heading:#0f1e15; --text-strong:#0a140e;
    --acc-green-text:#15803d; --acc-amber-text:#92400e; --acc-red-text:#b91c1c;
    --acc-teal-text:#0f766e; --acc-green-text2:#166534;
  }
  body.theme-light{
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(34,197,94,.09), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(245,158,11,.08), transparent 55%),
      radial-gradient(700px 400px at 50% 100%, rgba(45,212,191,.05), transparent 60%),
      #f3f6f4;
  }
  body.theme-light::before{ opacity:.6; }
  body.theme-light .sidebar{ box-shadow:1px 0 0 rgba(15,40,25,.06); }
  body.theme-light .panel{ box-shadow:0 1px 0 rgba(15,40,25,.03); }
  body.theme-light .modal-box{ box-shadow:0 30px 70px -30px rgba(15,40,25,.35); }
  body.theme-light .bracket-line-h{ background:linear-gradient(90deg, rgba(21,128,61,.35), rgba(146,64,14,.35)); }
  body.theme-light .bracket-line-v{ background:rgba(21,128,61,.3); }
  body.theme-light .team-crest, body.theme-light .avatar-circle, body.theme-light .team-crest-lg,
  body.theme-light .btn-primary, body.theme-light .rank-badge.top, body.theme-light .empty-icon,
  body.theme-light .avatar-admin{ color:#fff; }
  body.theme-light .color-swatch.selected{ outline-color:#0f1e15; }
  body.theme-light .tourn-switch select option, body.theme-light select.form-input option{ color:#0f1e15; }
  /* theme toggle switch di sidebar */
  .theme-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface-3); color:var(--text); font-weight:600; font-size:13px; margin-top:8px;}

  /* status sinkronisasi firebase */
  .fb-status{display:flex; align-items:center; gap:7px; padding:8px 14px 2px; font-size:11px; color:var(--muted);}
  .fb-status .dot{width:7px; height:7px; border-radius:50%; background:#94a3b8; flex-shrink:0; box-shadow:0 0 0 3px rgba(148,163,184,.15);}
  .fb-status.st-synced .dot{background:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,.18);}
  .fb-status.st-connecting .dot, .fb-status.st-saving .dot{background:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.18);}
  .fb-status.st-error .dot{background:#f87171; box-shadow:0 0 0 3px rgba(248,113,113,.18);}
  .fb-config-box{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-3); white-space:pre-wrap; word-break:break-all; margin-top:10px;}
</style>

function h(tag, props, children){
  props = props || {}; children = children===undefined ? [] : children;
  const el = document.createElement(tag);
  Object.keys(props).forEach(function(k){
    const v = props[k];
    if (v===undefined || v===null || v===false) return;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='style' && typeof v==='object') Object.assign(el.style, v);
    else el.setAttribute(k, v===true?'':v);
  });
  (Array.isArray(children)?children:[children]).forEach(function(c){
    if (c===null||c===undefined||c===false) return;
    el.appendChild((typeof c==='string'||typeof c==='number') ? document.createTextNode(c) : c);
  });
  return el;
}
function frag(children){ const f=document.createDocumentFragment(); (children||[]).forEach(function(c){ if(c) f.appendChild(c); }); return f; }

// Parse tanggal format "18 Jul 2026" + jam "15:30" jadi timestamp yang bisa diurutkan.
// Dipakai supaya urutan "Hasil Pertandingan" di Klasemen Grup mengikuti urutan tanggal
// pertandingan sebenarnya, bukan sekadar urutan data ditambahkan.
var MONTH_NAMES_ID = ['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'];
function fixtureSortKey(s){
  var d = (s.date||'').trim().toLowerCase();
  var parts = d.split(' ');
  if (parts.length === 3){
    var day = parseInt(parts[0],10);
    var mIdx = MONTH_NAMES_ID.indexOf(parts[1].slice(0,3));
    var year = parseInt(parts[2],10);
    if (!isNaN(day) && mIdx>-1 && !isNaN(year)){
      var timeParts = (s.time||'00:00').split(':');
      var hh = parseInt(timeParts[0],10)||0, mm = parseInt(timeParts[1],10)||0;
      return new Date(year, mIdx, day, hh, mm).getTime();
    }
  }
  return 0; // tanggal tak dikenali (mis. "Pertandingan Live") -> taruh paling awal, jangan sampai error
}

const PLAYER_INITIALS = ["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O","P","R","S","T","W","Y","Z"];
const PLAYER_GIVEN_NAMES = [

function shuffleArr(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}

/* Lengkapi skuad tim menjadi 12 pemain (target komposisi 2 GK, 4 DF, 4 MF, 2 FW),
   sambil mempertahankan pemain yang sudah ada (mis. pencetak gol andalan). */
function buildFullSquad(existingPlayers, seedIndex){
  const players = (existingPlayers||[]).map(function(p){ return Object.assign({}, p); });
  const target = {GK:2, DF:4, MF:4, FW:2};
  players.forEach(function(p){ if (target[p.position]!==undefined && target[p.position]>0) target[p.position]--; });

  const usedNumbers = {}; players.forEach(function(p){ usedNumbers[p.number]=true; });
  const usedNames = {}; players.forEach(function(p){ usedNames[p.name]=true; });

  const availableNumbers = shuffleArr(Array.from({length:25}, function(_,i){ return i+1; })).filter(function(n){ return !usedNumbers[n]; });

  const initialsPool = shuffleArr(PLAYER_INITIALS);
  const namesPool = shuffleArr(PLAYER_GIVEN_NAMES);
  let namePtr = 0, initPtr = 0, numPtr = 0;

  function nextUniqueName(){
    let attempt = 0;
    while (attempt < 200){
      const ini = initialsPool[initPtr % initialsPool.length]; initPtr++;
      const given = namesPool[namePtr % namesPool.length]; namePtr++;
      const full = ini + '. ' + given;
      if (!usedNames[full]){ usedNames[full]=true; return full; }
      attempt++;
    }
    return 'X. Pemain' + (seedIndex||0) + '-' + attempt;
  }

  POSITIONS.forEach(function(pos){
    let count = target[pos]||0;
    while (count > 0){
      const number = availableNumbers[numPtr] !== undefined ? availableNumbers[numPtr] : (90+numPtr);
      numPtr++;
      players.push({ id: nextId(), name: nextUniqueName(), number: number, position: pos });
      count--;
    }
  });

  return players;
}

function initials(name){
  return (name||'').split(' ').map(function(p){return p[0];}).join('').slice(0,2).toUpperCase();
}

function generateTeams(count){

}

function buildBracketRounds(teamCount, teams, opts){
  opts = opts || {};
  let slots;
  let firstRoundNames = null;
  if (opts.slots){
    // Mode kualifikasi khusus: ukuran bagan ditentukan manual (mis. jumlah juara grup),
    // bukan dari total jumlah tim di turnamen.
    slots = 2; while (slots < opts.slots) slots *= 2;
    slots = Math.min(Math.max(slots,2),16);
    firstRoundNames = opts.firstRoundNames || null;
  } else {
    slots = 2; while (slots < teamCount) slots *= 2;
    slots = Math.min(Math.max(slots,2),16);
  }
  const names = []; let n = slots;
  while (n >= 2){
    if (n===2) names.push('Final');
    else if (n===4) names.push('Semifinal');
    else if (n===8) names.push('Perempat Final');
    else names.push('Babak '+n+' Besar');
    n = n/2;
  }
  const rounds = []; let matchCount = slots/2;
  names.forEach(function(name, idx){
    const matches = [];
    for (let i=0;i<matchCount;i++){
      let a='TBD', b='TBD';
      if (idx===0){
        if (firstRoundNames){ a = firstRoundNames[i*2] || 'TBD'; b = firstRoundNames[i*2+1] || 'TBD'; }
        else { a = (teams[i*2] && teams[i*2].name) || 'TBD'; b = (teams[i*2+1] && teams[i*2+1].name) || 'TBD'; }
      }
      matches.push({a:a,b:b,scoreA:0,scoreB:0});
    }
    rounds.push({name:name, matches:matches});
    matchCount = matchCount/2;
  });
  return rounds;
}
function createTournament(form){
  const teams = generateTeams(form.teamCount);
  let groups = [];
  if (form.format !== 'knockout'){
    groups = generateGroups(form.groupCount);
    teams.forEach(function(t,i){ t.groupId = groups[i % groups.length].id; });
  }
  let bracket = null;
  if (form.format !== 'group'){
    if (form.onlyGroupWinners && groups.length > 0){
      // Hanya juara tiap grup yang lolos ke babak gugur (langsung ke semifinal/perempat final
      // sesuai jumlah grup), bukan seluruh tim.
      const firstRoundNames = groups.map(function(g){ return 'Juara ' + g.name; });
      bracket = { rounds: buildBracketRounds(form.teamCount, teams, {slots: groups.length, firstRoundNames: firstRoundNames}) };
    } else {
      bracket = { rounds: buildBracketRounds(form.teamCount, teams) };
    }
  }
  return {
    id: nextId(), name: form.name, format: form.format, emoji: form.emoji, color: form.color,
    onlyGroupWinners: !!form.onlyGroupWinners,
    matchConfig: { halfMinutes: form.halfMinutes || 10, halves: form.halves || 2 },
    teams: teams, groups: groups, bracket: bracket, schedule: [], liveMatch: null,
    matchStats:{possessionA:50,possessionB:50,shotsA:0,shotsB:0,passAccA:0,passAccB:0,cornersA:0,cornersB:0},
    topScorers: [], bestGK: [], news: []
  };
}

function renderLocal(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(buildApp());
}
function render(){
  renderLocal();
  scheduleSave();
}

function buildApp(){
  const t = T();
  const app = h('div', {class:'app'});

  if (state.sidebarOpen) app.appendChild(h('div', {class:'sidebar-overlay show', onclick:function(){ state.sidebarOpen=false; render(); }}));

  app.appendChild(buildSidebar(t));

  const mainWrap = h('div', {class:'main-wrap'});
  mainWrap.appendChild(buildHeader());
  mainWrap.appendChild(buildMain(t));
  app.appendChild(mainWrap);

  if (state.showAddTournament) app.appendChild(buildAddTournamentModal());
  if (state.showImportTeams) app.appendChild(buildImportTeamsModal(t));
  if (state.showAddEvent) app.appendChild(buildAddEventModal(t));
  if (state.showAddFixtureEvent) app.appendChild(buildAddFixtureEventModal(t));
  if (state.showEditPlayer) app.appendChild(buildEditPlayerModal(t));
  if (state.showBracketWinner) app.appendChild(buildBracketWinnerModal(t));
  if (state.showAdminLogin) app.appendChild(buildAdminLoginModal());

  return app;
}

/* ---------- LIST GOL / KARTU YANG BISA DIEDIT ----------
   Dipakai baik saat pertandingan masih live maupun setelah selesai (dari halaman
   Jadwal), supaya nama pencetak gol, menit, status penalti, dan jenis kartu bisa
   direvisi kapan saja tanpa harus hapus-lalu-tambah-ulang. */
function buildEventList(list, kind, onRemove){
  return h('div', {class:'scorer-list'}, list.map(function(item, i){
    if (!state.adminMode){
      const label = kind==='goal'
        ? ('⚽ ' + item.name + (item.penalty ? ' (Penalti)' : ''))
        : ((item.type==='red'?'🟥 ':'🟨 ') + item.name);
      return h('p', {style:{margin:'0 0 2px', display:'flex', alignItems:'center', gap:'4px'}}, [label + ' ', h('span',{class:'mono'}, item.minute+"'")]);
    }
    const row = h('p', {style:{margin:'0 0 4px', display:'flex', alignItems:'center', gap:'4px', flexWrap:'wrap'}});
    if (kind === 'card'){
      row.appendChild(h('button', {class:'icon-btn', style:{padding:'0 4px', fontSize:'11px'}, title:'Ganti jenis kartu', onclick:function(){ item.type = item.type==='red'?'yellow':'red'; render(); }}, item.type==='red'?'🟥':'🟨'));
    } else {
      row.appendChild(h('span', {}, '⚽'));
    }
    row.appendChild(editableText(function(){return item.name;}, function(v){item.name=v;}, ''));
    if (kind === 'goal'){
      row.appendChild(h('button', {class:'icon-btn', style:{padding:'0 4px', fontSize:'10px', opacity: item.penalty?1:0.4}, title:'Tandai/batalkan penalti', onclick:function(){ item.penalty = !item.penalty; render(); }}, 'P'));
    }
    row.appendChild(editableNumber(function(){return item.minute;}, function(v){item.minute=v;}, '', {min:0}));
    row.appendChild(h('span',{class:'text-xs muted'}, "'"));
    row.appendChild(h('button', {class:'icon-btn', style:{padding:'0', width:'14px', height:'14px'}, title:'Hapus', onclick:function(){ onRemove(i); }}, icon('x',10)));
    return row;
  }));
}

/* ---------- TAMBAH GOL/KARTU KE HASIL PERTANDINGAN YANG SUDAH SELESAI ----------
   Berbeda dari buildAddEventModal (khusus pertandingan yang sedang live), modal ini
   dipakai dari halaman Jadwal untuk merevisi/menambah catatan gol & kartu pada
   pertandingan berstatus "Selesai" — termasuk yang dulu tidak pernah dicatat lewat
   mode live sama sekali (misalnya skor cuma diisi manual). */
function buildAddFixtureEventModal(t){
  const cfg = state.showAddFixtureEvent; // {fixtureId, side:'A'|'B', type:'goal'|'card'}
  const s = t.schedule.find(function(x){ return x.id === cfg.fixtureId; });
  if (!s){ state.showAddFixtureEvent = null; return h('div', {}); }
  const teamId = cfg.side === 'A' ? s.teamAId : s.teamBId;
  const team = t.teams.find(function(x){ return x.id === teamId; });
  const teamName = team ? team.name : (cfg.side==='A' ? 'Tim A' : 'Tim B');
  const players = team ? team.players : [];
  const scorersKey = cfg.side === 'A' ? 'scorersA' : 'scorersB';
  const cardsKey = cfg.side === 'A' ? 'cardsA' : 'cardsB';
  if (!s[scorersKey]) s[scorersKey] = [];
  if (!s[cardsKey]) s[cardsKey] = [];

  const form = { name:'', cardType:'yellow', minute:0, isPenalty:false, alsoScore:false };

  const close = function(){ state.showAddFixtureEvent = null; render(); };
  const overlay = h('div', {class:'modal-overlay', onclick:function(e){ if(e.target===overlay) close(); }});
  const box = h('div', {class:'modal-box', style:{maxWidth:'420px'}});
  const titleText = cfg.type==='goal' ? 'Tambah Pencetak Gol' : 'Tambah Kartu Pemain';
  box.appendChild(h('div', {class:'modal-head'}, [h('h3',{},titleText+' — '+teamName), h('button',{class:'modal-close', onclick:close}, icon('x',20))]));

  const body = h('div', {class:'flex-col gap-4'});
  const statusMsg = h('p', {class:'text-xs', style:{color:'var(--red)', margin:0, minHeight:'14px'}});

  const nameWrap = h('div', {});
  nameWrap.appendChild(h('label',{class:'form-label'},'Nama Pemain'));
  const customInput = h('input', {class:'form-input', placeholder:'Ketik nama pemain'});
  customInput.addEventListener('input', function(e){ form.name = e.target.value; });
  if (players && players.length > 0){
    const sel = h('select', {class:'form-input'});
    sel.appendChild(h('option',{value:''},'-- Pilih Pemain --'));
    players.forEach(function(p){ sel.appendChild(h('option',{value:p.name}, p.name + (p.number?(' #'+p.number):''))); });
    sel.appendChild(h('option',{value:'__custom__'},'Lainnya (ketik manual)'));
    sel.addEventListener('change', function(e){
      if (e.target.value === '__custom__'){ customInput.style.display = 'block'; form.name = ''; }
      else { customInput.style.display = 'none'; form.name = e.target.value; }
    });
    customInput.style.display = 'none';
    nameWrap.appendChild(sel);
  }
  nameWrap.appendChild(customInput);
  body.appendChild(nameWrap);

  if (cfg.type === 'card'){
    const typeWrap = h('div', {});
    typeWrap.appendChild(h('label',{class:'form-label'},'Jenis Kartu'));
    const typeGrid = h('div', {class:'flex gap-2'});
    const yBtn = h('button', {class:'btn btn-ghost-blue', style:{flex:'1'}, onclick:function(){ form.cardType='yellow'; yBtn.style.outline='2px solid var(--yellow)'; rBtn.style.outline='none'; }}, [h('span',{class:'card-y'}), ' Kuning']);
    const rBtn = h('button', {class:'btn btn-ghost-blue', style:{flex:'1'}, onclick:function(){ form.cardType='red'; rBtn.style.outline='2px solid var(--red)'; yBtn.style.outline='none'; }}, [h('span',{class:'card-r'}), ' Merah']);
    yBtn.style.outline = '2px solid var(--yellow)';
    typeGrid.appendChild(yBtn); typeGrid.appendChild(rBtn);
    typeWrap.appendChild(typeGrid);
    body.appendChild(typeWrap);
  }

  if (cfg.type === 'goal'){
    const penWrap = h('label', {class:'flex items-center gap-2', style:{cursor:'pointer'}});
    const penChk = h('input', {type:'checkbox'});
    penChk.addEventListener('change', function(e){ form.isPenalty = e.target.checked; });
    penWrap.appendChild(penChk);
    penWrap.appendChild(h('span', {class:'text-xs'}, 'Gol dari titik penalti'));
    body.appendChild(penWrap);
  }

  const minuteWrap = h('div', {});
  minuteWrap.appendChild(h('label',{class:'form-label'},'Menit'));
  const minuteInp = h('input', {type:'number', class:'form-input', value:0, min:0, max:120});
  minuteInp.addEventListener('input', function(e){ form.minute = parseInt(e.target.value,10); });
  minuteWrap.appendChild(minuteInp);
  body.appendChild(minuteWrap);

  if (cfg.type === 'goal'){
    const scoreWrap = h('label', {class:'flex items-center gap-2', style:{cursor:'pointer'}});
    const scoreChk = h('input', {type:'checkbox'});
    scoreChk.addEventListener('change', function(e){ form.alsoScore = e.target.checked; });
    scoreWrap.appendChild(scoreChk);
    scoreWrap.appendChild(h('span', {class:'text-xs'}, 'Ini gol baru — tambahkan +1 ke skor ' + teamName));
    body.appendChild(scoreWrap);
    body.appendChild(h('p', {class:'text-xs muted', style:{margin:0}}, 'Biarkan tidak dicentang kalau lo cuma mau mencatat nama pencetak gol yang sudah terhitung di skor saat ini.'));
  }

  body.appendChild(statusMsg);

  body.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px'}, onclick:function(){
    const name = (form.name||'').trim();
    if (!name){ statusMsg.textContent = 'Nama pemain wajib diisi.'; return; }
    const minute = isNaN(form.minute) ? 0 : Math.max(0, Math.min(120, form.minute));
    try{
      if (cfg.type === 'goal'){
        s[scorersKey].push({name:name, minute:minute, penalty: !!form.isPenalty});
        if (form.alsoScore){
          const newScore = (cfg.side==='A' ? (s.scoreA||0) : (s.scoreB||0)) + 1;
          setFixtureScore(t, s, cfg.side==='A' ? 'a' : 'b', newScore);
        }
        if (!t.topScorers) t.topScorers = [];
        const existing = t.topScorers.find(function(p){ return p.name.toLowerCase()===name.toLowerCase() && p.team===teamName; });
        if (existing) existing.goals = (existing.goals||0) + 1;
        else t.topScorers.push({id:nextId(), name:name, team:teamName, goals:1});
      } else {
        s[cardsKey].push({name:name, type:form.cardType, minute:minute});
        if (team){
          if (!team.fairplay) team.fairplay = {yellow:0, red:0};
          if (form.cardType==='red') team.fairplay.red = (team.fairplay.red||0)+1;
          else team.fairplay.yellow = (team.fairplay.yellow||0)+1;
        }
      }
    } catch(err){
      console.error('Gagal menyimpan gol/kartu:', err);
      statusMsg.textContent = 'Gagal menyimpan: ' + err.message;
      return;
    }
    close();
  }}, [icon(cfg.type==='goal'?'plus':'shield',16), cfg.type==='goal' ? 'Simpan Gol' : 'Simpan Kartu']));

  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

/* ---------- EDIT PLAYER MODAL (ubah nama & nomor punggung pemain) ---------- */
function buildEditPlayerModal(t){
  const cfg = state.showEditPlayer; // {teamId, playerId}
  const team = t.teams.find(function(tm){ return tm.id === cfg.teamId; });
  const player = team ? team.players.find(function(p){ return p.id === cfg.playerId; }) : null;
  if (!team || !player){
    state.showEditPlayer = null;
    return h('div', {});
  }

  const form = { name: player.name, number: player.number, position: player.position };

  const close = function(){ state.showEditPlayer = null; render(); };
  const overlay = h('div', {class:'modal-overlay', onclick:function(e){ if(e.target===overlay) close(); }});
  const box = h('div', {class:'modal-box', style:{maxWidth:'380px'}});
  box.appendChild(h('div', {class:'modal-head'}, [h('h3',{},'Edit Pemain — ' + team.name), h('button',{class:'modal-close', onclick:close}, icon('x',20))]));

  const body = h('div', {class:'flex-col gap-4'});
  const statusMsg = h('p', {class:'text-xs', style:{color:'var(--red)', margin:0, minHeight:'14px'}});

  const nameWrap = h('div', {});
  nameWrap.appendChild(h('label',{class:'form-label'},'Nama Pemain'));
  const nameInp = h('input', {class:'form-input', value: form.name});
  nameInp.addEventListener('input', function(e){ form.name = e.target.value; });
  nameWrap.appendChild(nameInp);
  body.appendChild(nameWrap);

  const numWrap = h('div', {});
  numWrap.appendChild(h('label',{class:'form-label'},'Nomor Punggung'));
  const numInp = h('input', {type:'number', class:'form-input', value: form.number});
  numInp.addEventListener('input', function(e){ form.number = parseInt(e.target.value, 10); });
  numWrap.appendChild(numInp);
  body.appendChild(numWrap);

  const posWrap = h('div', {});
  posWrap.appendChild(h('label',{class:'form-label'},'Posisi'));
  const posSel = h('select', {class:'form-input'}, POSITIONS.map(function(pos){ return h('option',{value:pos, selected: form.position===pos?true:undefined}, pos); }));
  posSel.value = form.position;
  posSel.addEventListener('change', function(e){ form.position = e.target.value; });
  posWrap.appendChild(posSel);
  body.appendChild(posWrap);

  body.appendChild(statusMsg);

  body.appendChild(h('button', {class:'btn btn-primary w-full', style:{padding:'12px'}, onclick:function(){
    const name = (form.name||'').trim();
    if (!name){ statusMsg.textContent = 'Nama pemain wajib diisi.'; return; }
    if (isNaN(form.number) || form.number < 0){ statusMsg.textContent = 'Nomor punggung tidak valid.'; return; }
    const dup = team.players.find(function(p){ return p.id !== player.id && p.number === form.number; });
    if (dup){ statusMsg.textContent = 'Nomor ' + form.number + ' sudah dipakai oleh ' + dup.name + '.'; return; }
    try{
      player.name = name;
      player.number = form.number;
      player.position = form.position;
    } catch(err){
      console.error('Gagal menyimpan perubahan pemain:', err);
      statusMsg.textContent = 'Gagal menyimpan: ' + err.message;
      return;
    }
    close();
  }}, [icon('check',16), 'Simpan Perubahan']));

  box.appendChild(body);
  overlay.appendChild(box);
  return overlay;
}

/* ---------- Editable primitives ---------- */
function editableText(getVal, setVal, className){
  if (!state.adminMode){
    return h('span', {class: className}, getVal());
  }
  const input = h('input', {type:'text', class:'inline-edit ' + className, value: getVal()});
  function commit(){
    const v = input.value.trim()===''? getVal() : input.value;
    if (v !== getVal()){ setVal(v); render(); }
  }
  input.addEventListener('change', commit);
  input.addEventListener('keydown', function(e){ if (e.key==='Enter') input.blur(); });
  input.addEventListener('click', function(e){ e.stopPropagation(); });
  return input;
}
function editableNumber(getVal, setVal, className, opts){
  opts = opts||{}; const min = opts.min===undefined?0:opts.min;
  if (!state.adminMode){
    return h('span', {class: className}, String(getVal()));
  }
  const input = h('input', {type:'number', class:'inline-edit-num ' + className, value: getVal()});
  function commit(){
    let v = parseInt(input.value,10); if (isNaN(v)) v = getVal(); v = Math.max(min, v);
    if (v !== getVal()){ setVal(v); render(); }
  }
  input.addEventListener('change', commit);
  input.addEventListener('keydown', function(e){ if (e.key==='Enter') input.blur(); });
  input.addEventListener('click', function(e){ e.stopPropagation(); });
  return input;
}
/* ---------- LOGO / GAMBAR: kompres dulu sebelum disimpan ----------
   Foto dari HP bisa 2-5 MB. Kalau disimpan mentah sebagai base64, ukurannya
   membengkak ~33% dan langsung menembus batas Firestore (1 MB per dokumen)
   maupun kuota localStorage — akibatnya penyimpanan gagal diam-diam dan logo
   "hilang" lagi. Jadi setiap gambar di-resize ke kotak kecil dan dikompres
   ke JPEG dulu, hasilnya cuma belasan KB per logo. */
const LOGO_MAX_PX = 256;      // sisi terpanjang logo setelah di-resize
const LOGO_QUALITY = 0.82;    // kualitas JPEG (0-1)

function compressImageFile(file, cb){
  if (!file || !/^image\//.test(file.type)){ cb(null, 'File yang dipilih bukan gambar.'); return; }
  const reader = new FileReader();
  reader.onerror = function(){ cb(null, 'Gagal membaca file gambar.'); };
  reader.onload = function(ev){
    const img = new Image();
    img.onerror = function(){ cb(null, 'Format gambar tidak didukung browser.'); };
    img.onload = function(){
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (!w || !h){ cb(null, 'Ukuran gambar tidak terbaca.'); return; }
      const scale = Math.min(1, LOGO_MAX_PX / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      // latar putih supaya PNG transparan tidak jadi hitam saat diubah ke JPEG
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try{
        cb(canvas.toDataURL('image/jpeg', LOGO_QUALITY), null);
      } catch(err){
        console.error('Gagal mengompres gambar:', err);
        cb(null, 'Gagal memproses gambar.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* Satu input file yang dipakai ulang, supaya tidak menumpuk elemen tersembunyi

function ensureLiveTimer(){
  if (liveTimerHandle) return;
  liveTimerHandle = setInterval(function(){
    if (!state.liveRunning) return;
    const t = T();
    if (!t.liveMatch || state.active !== 'dashboard') return;
    let m = t.liveMatch.minute, s = t.liveMatch.second;
    s += 1; if (s>=60){ s=0; m+=1; }
    const mc = t.matchConfig || {halfMinutes:10, halves:2};
    const totalMin = mc.halfMinutes * mc.halves;
    if (m>=totalMin) return;
    t.liveMatch.minute = m; t.liveMatch.second = s;
    if (shouldSkipAutoRender()) return;
    // Jam berjalan tiap detik cuma diperbarui LOKAL di layar ini — kalau tiap detik juga
    // dikirim penuh ke Firebase, koneksi (apalagi di HP/data seluler) kebanjiran kiriman
    // dan bikin device lain lambat nerima update. Kirim ke cloud cukup tiap 5 detik saja;
    // perubahan penting (gol, kartu, skor, jeda, selesai) tetap langsung terkirim seperti biasa
    // karena itu semua manggil render() biasa, bukan lewat sini.
    renderLocal();
    if (s % 5 === 0) scheduleSave();
  }, 1000);
}

/* ---------- GUARD: cegah render otomatis (dari background/Firebase) menutup paksa
   kalender/jam yang lagi kebuka, dropdown, atau input yang lagi diketik ---------- */
let pendingBackgroundRender = false;
let pendingBackgroundRenderSince = 0;
function shouldSkipAutoRender(){
  // Modal terbuka -> jangan render ulang di belakang layar (biar isian di form tidak hilang).
  if (state.showAddTournament || state.showImportTeams || state.showAddEvent || state.showAddFixtureEvent || state.showBracketWinner || state.showAdminLogin || state.showEditPlayer) return true;
  // Ada input/select/textarea yang sedang fokus (termasuk saat kalender/jam native browser lagi kebuka)
  // -> jangan render ulang, supaya popup-nya tidak ketutup paksa.
  const ae = document.activeElement;
  if (ae && (ae.tagName==='INPUT' || ae.tagName==='SELECT' || ae.tagName==='TEXTAREA')) return true;
  return false;
}
// Dipakai oleh event Firebase (auth state change, snapshot realtime) yang bisa muncul
// kapan saja di belakang layar. Kalau lagi tidak aman untuk render ulang, tunda dulu
// dan biarkan interval flush di bawah yang menyelesaikannya begitu user selesai berinteraksi.
function safeRender(){
  if (shouldSkipAutoRender()){
    if (!pendingBackgroundRender) pendingBackgroundRenderSince = Date.now();
    pendingBackgroundRender = true;
    return;
  }
  pendingBackgroundRender = false;
  render();
}
setInterval(function(){
  if (!pendingBackgroundRender) return;
  // Kalau field yang lagi fokus dibiarkan berlarut-larut (mis. kursor ketinggalan di suatu
  // kolom tanpa pernah diklik lagi), update dari device lain bisa numpuk tak terlihat tanpa
  // batas waktu. Setelah 12 detik, paksa tampilkan update terbaru — lebih baik daripada
  // layar yang ketinggalan jauh dari data sebenarnya.
  const stuckTooLong = pendingBackgroundRenderSince && (Date.now() - pendingBackgroundRenderSince > 12000);
  if (!shouldSkipAutoRender() || stuckTooLong){
    pendingBackgroundRender = false;
    render();
  }
}, 400);

  panel.appendChild(statBar('Possession %', function(){return st.possessionA;}, function(){return st.possessionB;},
    function(v){ st.possessionA=v; st.possessionB=100-v; }, function(v){ st.possessionB=v; st.possessionA=100-v; }));
  panel.appendChild(statBar('Tembakan', function(){return st.shotsA;}, function(){return st.shotsB;}, function(v){st.shotsA=v;}, function(v){st.shotsB=v;}));
  panel.appendChild(statBar('Akurasi Operan %', function(){return st.passAccA;}, function(){return st.passAccB;}, function(v){st.passAccA=v;}, function(v){st.passAccB=v;}));
  panel.appendChild(statBar('Sepak Pojok', function(){return st.cornersA;}, function(){return st.cornersB;}, function(v){st.cornersA=v;}, function(v){st.cornersB=v;}));
  return panel;
}

/* ---------- GROUP STANDINGS ---------- */
/* ---------- SYNC HASIL PERTANDINGAN -> KLASEMEN & BAGAN ---------- */
function applyMatchResultToStandings(t, teamAId, teamBId, scoreA, scoreB){
  const a = t.teams.find(function(x){return x.id===teamAId;});
  const b = t.teams.find(function(x){return x.id===teamBId;});
  scoreA = Number(scoreA)||0; scoreB = Number(scoreB)||0;
  if (a){ a.stats.played=(a.stats.played||0)+1; a.stats.gf=(a.stats.gf||0)+scoreA; a.stats.ga=(a.stats.ga||0)+scoreB; a.stats.gd=(a.stats.gd||0)+(scoreA-scoreB); }
  if (b){ b.stats.played=(b.stats.played||0)+1; b.stats.gf=(b.stats.gf||0)+scoreB; b.stats.ga=(b.stats.ga||0)+scoreA; b.stats.gd=(b.stats.gd||0)+(scoreB-scoreA); }
  if (scoreA>scoreB){ if(a){ a.stats.pts=(a.stats.pts||0)+3; a.stats.win=(a.stats.win||0)+1; } if(b){ b.stats.lose=(b.stats.lose||0)+1; } }
  else if (scoreB>scoreA){ if(b){ b.stats.pts=(b.stats.pts||0)+3; b.stats.win=(b.stats.win||0)+1; } if(a){ a.stats.lose=(a.stats.lose||0)+1; } }
  else { if(a){ a.stats.pts=(a.stats.pts||0)+1; a.stats.draw=(a.stats.draw||0)+1; } if(b){ b.stats.pts=(b.stats.pts||0)+1; b.stats.draw=(b.stats.draw||0)+1; } }
}
function syncBracketScore(t, nameA, nameB, scoreA, scoreB){
  if (!t.bracket) return;
  for (let ri=0; ri<t.bracket.rounds.length; ri++){
    const matches = t.bracket.rounds[ri].matches;
    for (let mi=0; mi<matches.length; mi++){
      const m = matches[mi];
      if (m.winner) continue;
      if (m.a===nameA && m.b===nameB){ m.scoreA=scoreA; m.scoreB=scoreB; return; }
      if (m.a===nameB && m.b===nameA){ m.scoreA=scoreB; m.scoreB=scoreA; return; }
    }
  }
}
// Tim peringkat 1 di sebuah grup (kriteria sama seperti urutan klasemen: poin, lalu selisih gol, lalu gol memasukkan).
function groupWinner(t, groupId){
  const teamsInGroup = t.teams.filter(function(tm){ return tm.groupId === groupId; });
  if (teamsInGroup.length === 0) return null;
  return teamsInGroup.slice().sort(function(a,b){ return b.stats.pts-a.stats.pts || b.stats.gd-a.stats.gd || (b.stats.gf||0)-(a.stats.gf||0); })[0];
}
// Grup ini sudah pernah main setidaknya satu pertandingan atau belum — dipakai supaya bagan
// tidak buru-buru menampilkan nama tim tertentu sebelum grup itu benar-benar mulai bertanding.
function groupHasPlayed(t, groupId){
  return t.teams.some(function(tm){ return tm.groupId===groupId && (tm.stats.played||0) > 0; });
}
// Isi otomatis babak pertama bagan (biasanya Semifinal) dengan nama juara tiap grup,
// supaya langsung kelihatan siapa yang sudah lolos — dipanggil setiap hasil pertandingan
// fase grup berubah, dan juga bisa dipicu manual dari halaman Bagan.
// Pola pasangan silang: Juara Grup A vs Juara Grup C (Semifinal 1), Juara Grup B vs Juara Grup D (Semifinal 2).
function syncBracketFromGroupWinners(t){
  if (!t.bracket || !t.groups || t.groups.length < 2) return;
  const round0 = t.bracket.rounds[0];
  if (!round0) return;
  // Hanya jalan kalau jumlah grup pas dua kali jumlah pertandingan di babak pertama
  // (mis. 4 grup -> 2 pertandingan semifinal). Kalau formatnya beda, jangan dipaksa.
  const numMatches = round0.matches.length;
  if (t.groups.length !== numMatches * 2) return;
  for (let mi=0; mi<numMatches; mi++){
    const m = round0.matches[mi];
    if (m.winner) continue; // pertandingan ini sudah ada hasilnya, jangan diganggu
    const gA = t.groups[mi], gB = t.groups[mi + numMatches];
    const wA = gA ? groupWinner(t, gA.id) : null;
    const wB = gB ? groupWinner(t, gB.id) : null;
    // Kalau grupnya belum pernah main sama sekali, jangan tampilkan nama tim tertentu dulu
    // (itu cuma tim pertama di daftar, belum tentu bakal jadi juara) — pakai label generik saja.
    if (wA) m.a = groupHasPlayed(t, gA.id) ? wA.name : ('Juara ' + gA.name);
    if (wB) m.b = groupHasPlayed(t, gB.id) ? wB.name : ('Juara ' + gB.name);
  }
}
function undoMatchResultFromStandings(t, teamAId, teamBId, scoreA, scoreB){
  const a = t.teams.find(function(x){return x.id===teamAId;});
  const b = t.teams.find(function(x){return x.id===teamBId;});
  scoreA = Number(scoreA)||0; scoreB = Number(scoreB)||0;
  if (a){ a.stats.played=Math.max(0,(a.stats.played||0)-1); a.stats.gf=Math.max(0,(a.stats.gf||0)-scoreA); a.stats.ga=Math.max(0,(a.stats.ga||0)-scoreB); a.stats.gd=(a.stats.gd||0)-(scoreA-scoreB); }
  if (b){ b.stats.played=Math.max(0,(b.stats.played||0)-1); b.stats.gf=Math.max(0,(b.stats.gf||0)-scoreB); b.stats.ga=Math.max(0,(b.stats.ga||0)-scoreA); b.stats.gd=(b.stats.gd||0)-(scoreB-scoreA); }
  if (scoreA>scoreB){ if(a){ a.stats.pts=Math.max(0,(a.stats.pts||0)-3); a.stats.win=Math.max(0,(a.stats.win||0)-1); } if(b){ b.stats.lose=Math.max(0,(b.stats.lose||0)-1); } }
  else if (scoreB>scoreA){ if(b){ b.stats.pts=Math.max(0,(b.stats.pts||0)-3); b.stats.win=Math.max(0,(b.stats.win||0)-1); } if(a){ a.stats.lose=Math.max(0,(a.stats.lose||0)-1); } }
  else { if(a){ a.stats.pts=Math.max(0,(a.stats.pts||0)-1); a.stats.draw=Math.max(0,(a.stats.draw||0)-1); } if(b){ b.stats.pts=Math.max(0,(b.stats.pts||0)-1); b.stats.draw=Math.max(0,(b.stats.draw||0)-1); } }
}
// Best Goalkeepers: kalau tim kebobolan 0 gol di sebuah pertandingan, kiper tim itu (pemain
// dengan posisi "GK" di skuad) otomatis dapat +1 clean sheet. Kalau tim belum punya pemain
// yang ditandai posisi GK, tidak ada yang bisa di-attribute jadi dilewati saja.
function bumpCleanSheet(t, teamId, delta){
  const team = t.teams.find(function(x){return x.id===teamId;});
  if (!team) return;
  const gk = team.players.find(function(p){return p.position==='GK';});
  if (!gk) return;
  if (!t.bestGK) t.bestGK = [];
  const existing = t.bestGK.find(function(g){ return g.name.toLowerCase()===gk.name.toLowerCase() && g.team===team.name; });
  if (existing){ existing.cleanSheets = Math.max(0, (existing.cleanSheets||0) + delta); }
  else if (delta > 0){ t.bestGK.push({id:nextId(), name:gk.name, team:team.name, cleanSheets:delta}); }
}
function applyCleanSheets(t, teamAId, teamBId, scoreA, scoreB){
  if (Number(scoreB)===0) bumpCleanSheet(t, teamAId, 1); // Tim A clean sheet kalau Tim B tidak cetak gol
  if (Number(scoreA)===0) bumpCleanSheet(t, teamBId, 1); // Tim B clean sheet kalau Tim A tidak cetak gol
}
function undoCleanSheets(t, teamAId, teamBId, scoreA, scoreB){
  if (Number(scoreB)===0) bumpCleanSheet(t, teamAId, -1);
  if (Number(scoreA)===0) bumpCleanSheet(t, teamBId, -1);
}

// Dipakai saat admin edit manual skor pertandingan yang sudah "Selesai" — klasemen & bagan ikut disesuaikan.
function setFixtureScore(t, s, side, value){
  if (s.statsApplied){
    undoMatchResultFromStandings(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
    undoCleanSheets(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
  }
  if (side==='a') s.scoreA = value; else s.scoreB = value;
  if (s.statsApplied){
    applyMatchResultToStandings(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
    applyCleanSheets(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
    const an = (t.teams.find(function(x){return x.id===s.teamAId;})||{}).name;
    const bn = (t.teams.find(function(x){return x.id===s.teamBId;})||{}).name;
    if (an && bn) syncBracketScore(t, an, bn, Number(s.scoreA)||0, Number(s.scoreB)||0);
    syncBracketFromGroupWinners(t);
  }
}
// Menyelesaikan sebuah jadwal (fixture): menyalin skor (dari live match bila cocok),
// menandai selesai, lalu menerapkan hasilnya ke klasemen & bagan sekali saja.
function finalizeFixture(t, s){
  const teamAName = (t.teams.find(function(x){return x.id===s.teamAId;})||{}).name;
  const teamBName = (t.teams.find(function(x){return x.id===s.teamBId;})||{}).name;
  // Cocokkan live match ke jadwal ini via ID tim, ATAU via nama (fallback) — supaya kalau nama
  // tim di layar live sempat diketik manual beda dari roster, datanya tetap tersambung dengan benar.
  const lmMatches = !!(t.liveMatch && (
    (t.liveMatch.teamA.id===s.teamAId && t.liveMatch.teamB.id===s.teamBId) ||
    (t.liveMatch.teamA.name===teamAName && t.liveMatch.teamB.name===teamBName)
  ));
  if (s.statsApplied && lmMatches){
    // Pertandingan ini sebelumnya sudah pernah "Selesai", tapi baru saja dimainkan ulang lewat
    // Live (mis. skor/gol direvisi) — lepas dulu statistik lama sebelum menimpa dengan yang baru,
    // supaya klasemen tidak dobel terhitung.
    undoMatchResultFromStandings(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
    undoCleanSheets(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
    s.statsApplied = false;
  }
  if (lmMatches){
    s.scoreA = t.liveMatch.teamA.score||0;
    s.scoreB = t.liveMatch.teamB.score||0;
    // Simpan detail pencetak gol & kartu supaya tidak hilang begitu live match ditutup —
    // biar tetap bisa direvisi nanti dari halaman Jadwal.
    s.scorersA = (t.liveMatch.teamA.scorers || []).slice();
    s.scorersB = (t.liveMatch.teamB.scorers || []).slice();
    s.cardsA = (t.liveMatch.teamA.cards || []).slice();
    s.cardsB = (t.liveMatch.teamB.cards || []).slice();
  }
  if (s.statsApplied){ s.status='finished'; if (lmMatches) t.liveMatch=null; return; }
  s.status = 'finished';
  applyMatchResultToStandings(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
  applyCleanSheets(t, s.teamAId, s.teamBId, s.scoreA, s.scoreB);
  if (teamAName && teamBName) syncBracketScore(t, teamAName, teamBName, Number(s.scoreA)||0, Number(s.scoreB)||0);
  syncBracketFromGroupWinners(t);
  s.statsApplied = true;
  if (lmMatches){
    t.liveMatch = null;
  }
}
// Menyelesaikan live match langsung dari dashboard (dengan atau tanpa jadwal terkait).
function finalizeLiveMatch(t){
  if (!t.liveMatch) return;
  const lm = t.liveMatch;
  let s = t.schedule.find(function(x){ return x.status==='live' && x.teamAId===lm.teamA.id && x.teamBId===lm.teamB.id; });
  if (!s){
    s = { id:nextId(), teamAId:lm.teamA.id, teamBId:lm.teamB.id, date:'Pertandingan Live', time:'', status:'upcoming', scoreA:lm.teamA.score||0, scoreB:lm.teamB.score||0, statsApplied:false };
    t.schedule.push(s);
  }
  finalizeFixture(t, s);
}

let standingsActiveGroup = null;

  }}, [icon('plus',12), 'Tambah Grup']) : null;
  if (groupList.length > 1 || (state.adminMode && t.groups.length > 0) || addGroupBtn){

      if (state.adminMode && g.id !== null && t.groups.length > 1){

          t.groups = t.groups.filter(function(x){return x.id!==g.id;});
          t.teams.forEach(function(tm){ if (tm.groupId===g.id) tm.groupId=null; });

        }}, icon('x',11)));
      }
      tabs.appendChild(tabWrap);
    });
    if (addGroupBtn) tabs.appendChild(addGroupBtn);
    tabsWrap.appendChild(tabs);
    panel.appendChild(tabsWrap);
  }

  const filtered = groupList.length<=1 ? t.teams : t.teams.filter(function(tm){return tm.groupId===standingsActiveGroup;});
  const sorted = filtered.slice().sort(function(a,b){ return b.stats.pts-a.stats.pts || b.stats.gd-a.stats.gd || (b.stats.gf||0)-(a.stats.gf||0); });

  // ---- Dua kolom: Hasil Pertandingan (kiri) + Tabel Klasemen (kanan) ----
  const cols = h('div', {class:'gs-cols'});
